<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Ocean Quest — complete schermfamilie</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#082948}body{min-height:100vh;padding:70px;background:radial-gradient(circle at 82% 0,rgba(55,216,220,.22),transparent 30%),radial-gradient(circle at 2% 100%,rgba(20,120,205,.12),transparent 32%),linear-gradient(145deg,#effcff,#dff8fa 52%,#effbff)}
    header{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:42px}.kicker{font-size:16px;font-weight:900;letter-spacing:2.5px;text-transform:uppercase;color:#0798ad}.kicker:before{content:"";display:inline-block;width:12px;height:12px;margin-right:10px;border-radius:50%;background:#f4b944;box-shadow:0 0 0 6px rgba(244,185,68,.14)}h1{margin:14px 0 8px;font-size:52px;letter-spacing:-1.5px;line-height:1}.subtitle{margin:0;color:#637c8f;font-size:19px}.pill{padding:13px 18px;border-radius:999px;color:#087a98;background:rgba(255,255,255,.82);border:1px solid rgba(255,255,255,.95);box-shadow:0 8px 22px rgba(7,62,91,.09);font-size:14px;font-weight:850}.grid{display:grid;gap:28px}.desktop .grid{grid-template-columns:repeat(3,1fr)}.mobile .grid{grid-template-columns:repeat(5,1fr);gap:24px}.panel{padding:13px;border-radius:25px;background:rgba(255,255,255,.88);border:1px solid rgba(255,255,255,.98);box-shadow:0 18px 36px rgba(6,60,88,.13)}.panel-head{height:48px;padding:3px 6px 10px;display:flex;align-items:center;gap:10px}.index{width:26px;height:26px;border-radius:9px;display:grid;place-items:center;color:white;font-size:11px;font-weight:900;background:linear-gradient(145deg,#0b7bd2,#0cb8c1)}.panel strong{font-size:17px}.panel small{display:block;margin-top:2px;color:#71889a;font-size:10px}.shot{display:block;width:100%;border-radius:16px;border:1px solid rgba(10,83,117,.10);box-shadow:0 8px 18px rgba(4,56,84,.09)}.mobile .panel{padding:10px;border-radius:22px}.mobile .panel-head{height:54px;padding:3px 4px 9px}.mobile .panel strong{font-size:14px}.mobile .panel small{font-size:8px}.mobile .shot{border-radius:15px}
  </style>
</head>
<body>
  <header><div><div class="kicker">NXTTRACK · Ocean Quest</div><h1 id="title">Definitief ouderportaal</h1><p class="subtitle" id="subtitle"></p></div><span class="pill">13 canonieke schermen · één designsysteem</span></header>
  <main class="grid" id="grid"></main>
  <script>
    const mode=new URLSearchParams(location.search).get('mode')||'desktop';document.body.classList.add(mode);
    const pages=[['overview','Overzicht','Interactieve zwemreis'],['planning','Planning','Lessen, inhalen en aanbod'],['lesson','Lesdetail','Informatie en afmelden'],['development','Ontwikkeling','Onderdelen, badges en hoofdstukken'],['badges','Badges','Categorieën en delen'],['media','Media','Privéfoto’s en toestemming'],['diplomas','Diploma’s','Kluis en verificatie'],['inbox','Inbox','Gesprekken en meldingen'],['payments','Betalingen','Abonnementen en facturen'],['documents','Documenten','Veilige downloads'],['feedback','Feedback','Campagnes en reacties'],['children','Gezin & toegang','Kinderen en rechten'],['profile','Profiel & meer','Voorkeuren en kindwissel']];
    document.getElementById('title').textContent=mode==='desktop'?'Desktop — complete schermfamilie':'Mobiel — complete schermfamilie';
    document.getElementById('subtitle').textContent=mode==='desktop'?'Floating sidebar, header en taakgerichte content op 1920×1080.':'Lichte bottomnav, één documentscroll en taakgerichte kaarten op 390×844.';
    document.getElementById('grid').innerHTML=pages.map((p,i)=>`<article class="panel"><div class="panel-head"><span class="index">${String(i+1).padStart(2,'0')}</span><div><strong>${p[1]}</strong><small>${p[2]}</small></div></div><img class="shot" src="screens/${mode}/${p[0]}.png" alt="${p[1]}"></article>`).join('');
  </script>
</body>
</html>
