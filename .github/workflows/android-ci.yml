name: Android native CI

on:
  pull_request:
    paths:
      - "apps/android/**"
      - "contracts/parent-portal/**"
      - "apps/web/app/api/native/**"
      - "apps/web/lib/auth/native-*.ts"
      - "apps/web/lib/domain/native-*.ts"
      - ".github/workflows/android-*.yml"
  push:
    branches:
      - main
    paths:
      - "apps/android/**"
      - "contracts/parent-portal/**"
      - "apps/web/app/api/native/**"
      - "apps/web/lib/auth/native-*.ts"
      - "apps/web/lib/domain/native-*.ts"
      - ".github/workflows/android-*.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Native contract, lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: true
      NXTTRACK_API_BASE_URL: https://staging.nxttrack.nl
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@0723195856401067f7a2779048b490ace7a47d7c # v5

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5

      - name: Ensure Android 37 SDK
        shell: bash
        run: |
          set -euo pipefail
          command -v sdkmanager
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          license_exit="${PIPESTATUS[1]}"
          set -o pipefail
          test "$license_exit" -eq 0
          sdkmanager \
            "platform-tools" "platforms;android-37" "build-tools;37.0.0"

      - name: Run native quality gate
        working-directory: apps/android
        run: |
          ./gradlew --no-daemon qualityGate \
            "-PNXTTRACK_API_BASE_URL=${NXTTRACK_API_BASE_URL}"

      - name: Build both debug and instrumentation APKs
        working-directory: apps/android
        run: |
          ./gradlew --no-daemon \
            :instructor-app:assembleDebug \
            :parent-app:assembleDebug \
            :core:data:assembleDebugAndroidTest \
            :core:design:assembleDebugAndroidTest \
            :instructor-app:assembleDebugAndroidTest \
            :parent-app:assembleDebugAndroidTest \
            "-PNXTTRACK_API_BASE_URL=${NXTTRACK_API_BASE_URL}"

      - name: Build unsigned release bundles
        working-directory: apps/android
        run: |
          ./gradlew --no-daemon \
            :instructor-app:bundleRelease \
            :parent-app:bundleRelease \
            "-PNXTTRACK_API_BASE_URL=${NXTTRACK_API_BASE_URL}"

      - name: Upload native diagnostics and artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: android-native-${{ github.sha }}
          path: |
            apps/android/**/build/reports/
            apps/android/**/build/outputs/apk/**/*.apk
            apps/android/**/build/outputs/bundle/release/*.aab
          if-no-files-found: warn
          retention-days: 14
