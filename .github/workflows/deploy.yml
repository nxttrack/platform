name: Deploy NXTTRACK

on:
  workflow_dispatch:
    inputs:
      target:
        description: Release target
        required: true
        type: choice
        options:
          - staging
          - production
      staging_release_sha:
        description: Full commit SHA already validated on staging (required for production)
        required: false
        type: string
      production_confirmation:
        description: Type PROMOTE_PRODUCTION for a production release
        required: false
        type: string
      production_approval_reference:
        description: Link or identifier for the recorded production approval (required for production)
        required: false
        type: string
      production_foundation_run_id:
        description: Successful production foundation audit run ID for this exact SHA
        required: false
        type: string
      production_migration_rehearsal_run_id:
        description: Successful production migration rehearsal run ID for this exact SHA
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: nxttrack-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref_name == 'main'
    runs-on: [self-hosted, linux, x64, nxttrack]

    environment: ${{ inputs.target }}

    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: 1
      NODE_OPTIONS: --max-old-space-size=1536

      TARGET: ${{ inputs.target }}
      RELEASE_TARGET: ${{ inputs.target }}
      RELEASE_CANONICAL_BRANCH: main
      STAGING_RELEASE_SHA: ${{ inputs.staging_release_sha }}
      PRODUCTION_RELEASE_CONFIRMATION: ${{ inputs.production_confirmation }}
      PRODUCTION_APPROVAL_REFERENCE: ${{ inputs.production_approval_reference }}
      PRODUCTION_FOUNDATION_RUN_ID: ${{ inputs.production_foundation_run_id }}
      PRODUCTION_MIGRATION_REHEARSAL_RUN_ID: ${{ inputs.production_migration_rehearsal_run_id }}
      BASE_DIR: /var/www/nxttrack/${{ inputs.target }}

      APP_ENV: ${{ vars.APP_ENV }}
      NODE_ENV: ${{ vars.NODE_ENV }}
      PORT: ${{ vars.PORT }}
      APP_URL: ${{ vars.APP_URL }}
      NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
      PLATFORM_ADMIN_URL: ${{ vars.PLATFORM_ADMIN_URL }}
      TENANT_DOMAIN_SUFFIX: ${{ vars.TENANT_DOMAIN_SUFFIX }}
      PLATFORM_HOSTNAMES: ${{ vars.PLATFORM_HOSTNAMES }}
      PLATFORM_MARKETING_HOSTNAMES: ${{ vars.PLATFORM_MARKETING_HOSTNAMES }}
      PLATFORM_ADMIN_HOSTNAMES: ${{ vars.PLATFORM_ADMIN_HOSTNAMES }}
      STAGING_HOSTNAMES: ${{ vars.STAGING_HOSTNAMES }}
      TENANT_BASE_DOMAINS: ${{ vars.TENANT_BASE_DOMAINS }}
      RESERVED_TENANT_SUBDOMAINS: ${{ vars.RESERVED_TENANT_SUBDOMAINS }}
      BASE_PATH: ${{ vars.BASE_PATH }}
      SERVICE_NAME: ${{ vars.SERVICE_NAME }}
      HEALTH_CHECK_DATABASE: ${{ vars.HEALTH_CHECK_DATABASE || 'auto' }}
      HEALTH_STRICT: ${{ vars.HEALTH_STRICT || 'false' }}
      REQUIRE_HEALTH_DATABASE: ${{ vars.REQUIRE_HEALTH_DATABASE || 'false' }}
      REQUIRE_HEALTH_COMMIT: ${{ vars.REQUIRE_HEALTH_COMMIT || 'true' }}
      RUNTIME_SMOKE_ROUTES: ${{ vars.RUNTIME_SMOKE_ROUTES }}
      TENANT_SMOKE_URL: ${{ vars.TENANT_SMOKE_URL }}
      TENANT_SMOKE_ROUTES: ${{ vars.TENANT_SMOKE_ROUTES }}

      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      JWT_SESSION: ${{ secrets.JWT_SESSION }}
      AUTH_CODE_PEPPER: ${{ secrets.AUTH_CODE_PEPPER }}
      EMAIL_SETTINGS_SECRET: ${{ secrets.EMAIL_SETTINGS_SECRET }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      RUN_DB_MIGRATIONS: ${{ vars.RUN_DB_MIGRATIONS }}
      DB_MIGRATE_DRY_RUN: ${{ vars.DB_MIGRATE_DRY_RUN }}
      DB_MIGRATE_INCLUDE_ALL: ${{ vars.DB_MIGRATE_INCLUDE_ALL }}
      BOOTSTRAP_PLATFORM_OWNER: ${{ vars.BOOTSTRAP_PLATFORM_OWNER }}
      BOOTSTRAP_PLATFORM_OWNER_EMAIL: ${{ vars.BOOTSTRAP_PLATFORM_OWNER_EMAIL || 'admin@nxttrack.nl' }}
      BOOTSTRAP_PLATFORM_OWNER_TEMP_PASSWORD: ${{ secrets.BOOTSTRAP_PLATFORM_OWNER_TEMP_PASSWORD }}
      BOOTSTRAP_PLATFORM_OWNER_RESET_PASSWORD: ${{ vars.BOOTSTRAP_PLATFORM_OWNER_RESET_PASSWORD }}
      RUN_PLAYWRIGHT_SMOKE: ${{ vars.RUN_PLAYWRIGHT_SMOKE }}
      PHASE16_TENANT_SLUG: ${{ vars.PHASE16_TENANT_SLUG }}
      PHASE16_TENANT_HOSTNAME: ${{ vars.PHASE16_TENANT_HOSTNAME }}
      PHASE16_TENANT_NAME: ${{ vars.PHASE16_TENANT_NAME }}
      PHASE16_RESET_E2E_PASSWORDS: ${{ vars.PHASE16_RESET_E2E_PASSWORDS }}
      PHASE16_SKIP_PLAYWRIGHT_INSTALL: ${{ vars.PHASE16_SKIP_PLAYWRIGHT_INSTALL }}
      PHASE16_SKIP_PLAYWRIGHT: ${{ vars.PHASE16_SKIP_PLAYWRIGHT }}
      E2E_PLATFORM_OWNER_EMAIL: ${{ secrets.E2E_PLATFORM_OWNER_EMAIL || vars.E2E_PLATFORM_OWNER_EMAIL }}
      E2E_PLATFORM_OWNER_PASSWORD: ${{ secrets.E2E_PLATFORM_OWNER_PASSWORD }}
      E2E_TENANT_ADMIN_EMAIL: ${{ secrets.E2E_TENANT_ADMIN_EMAIL || vars.E2E_TENANT_ADMIN_EMAIL }}
      E2E_TENANT_ADMIN_PASSWORD: ${{ secrets.E2E_TENANT_ADMIN_PASSWORD }}
      E2E_INSTRUCTOR_EMAIL: ${{ secrets.E2E_INSTRUCTOR_EMAIL || vars.E2E_INSTRUCTOR_EMAIL }}
      E2E_INSTRUCTOR_PASSWORD: ${{ secrets.E2E_INSTRUCTOR_PASSWORD }}
      E2E_PARENT_EMAIL: ${{ secrets.E2E_PARENT_EMAIL || vars.E2E_PARENT_EMAIL }}
      E2E_PARENT_PASSWORD: ${{ secrets.E2E_PARENT_PASSWORD }}
      E2E_ALLOW_FORCE_PASSWORD_CHANGE: ${{ vars.E2E_ALLOW_FORCE_PASSWORD_CHANGE || 'false' }}
      RLS_STAGING_TESTS_CONFIRMED: ${{ vars.RLS_STAGING_TESTS_CONFIRMED }}
      PLAYWRIGHT_STAGING_SMOKE_CONFIRMED: ${{ vars.PLAYWRIGHT_STAGING_SMOKE_CONFIRMED }}
      LOVABLE_VISUAL_CHECK_CONFIRMED: ${{ vars.LOVABLE_VISUAL_CHECK_CONFIRMED }}
      SUPABASE_BACKUPS_CONFIRMED: ${{ vars.SUPABASE_BACKUPS_CONFIRMED }}
      ROLLBACK_REHEARSAL_CONFIRMED: ${{ vars.ROLLBACK_REHEARSAL_CONFIRMED }}
      STAGING_LAUNCH_STRICT: ${{ inputs.target == 'production' && 'true' || vars.STAGING_LAUNCH_STRICT || 'false' }}
      SUPABASE_ADVISOR_TYPE: ${{ vars.SUPABASE_ADVISOR_TYPE }}
      SUPABASE_ADVISOR_LEVEL: ${{ vars.SUPABASE_ADVISOR_LEVEL }}
      SUPABASE_ADVISOR_FAIL_ON: ${{ vars.SUPABASE_ADVISOR_FAIL_ON }}
      SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
      SMTP_HOST: ${{ vars.SMTP_HOST }}
      SMTP_PORT: ${{ vars.SMTP_PORT }}
      SMTP_USER: ${{ vars.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD || secrets.SMTP_PASS }}
      SMTP_SECURE: ${{ vars.SMTP_SECURE }}
      SMTP_EHLO_HOSTNAME: ${{ vars.SMTP_EHLO_HOSTNAME }}
      SMTP_FROM: ${{ vars.SMTP_FROM }}
      SMTP_FROM_EMAIL: ${{ vars.SMTP_FROM_EMAIL }}
      SMTP_FROM_NAME: ${{ vars.SMTP_FROM_NAME }}
      EMAIL_DELIVERY_TIMEOUT_MS: ${{ vars.EMAIL_DELIVERY_TIMEOUT_MS || '15000' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assert canonical release source
        run: |
          set -euo pipefail
          pnpm run release:truth
          pnpm run release:assert-source

      - name: Verify production foundation evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/release/verify-production-evidence.mjs

      - name: Check runtime
        run: |
          set -euo pipefail
          node -v
          pnpm -v
          echo "Target: $TARGET"
          echo "Service: $SERVICE_NAME"
          echo "App URL: $APP_URL"
          echo "Tenant suffix: $TENANT_DOMAIN_SUFFIX"
          echo "Tenant base domains: ${TENANT_BASE_DOMAINS:-default}"
          echo "Run DB migrations: ${RUN_DB_MIGRATIONS:-false}"
          echo "Bootstrap platform owner: ${BOOTSTRAP_PLATFORM_OWNER:-false}"

      - name: Prepare release directory
        run: |
          set -euo pipefail

          RELEASE="$BASE_DIR/releases/$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::7}"

          mkdir -p "$RELEASE"
          mkdir -p "$BASE_DIR/shared"

          rsync -a --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='.next' \
            --exclude='dist' \
            --exclude='.env' \
            ./ "$RELEASE/"

          echo "RELEASE=$RELEASE" >> "$GITHUB_ENV"

      - name: Write environment file
        run: |
          set -euo pipefail

          SUPABASE_PUBLIC_KEY="${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:-$NEXT_PUBLIC_SUPABASE_ANON_KEY}"
          SUPABASE_SERVER_SECRET="${SUPABASE_SECRET_KEY:-$SUPABASE_SERVICE_ROLE_KEY}"
          EFFECTIVE_SESSION_SECRET="${SESSION_SECRET:-$JWT_SESSION}"
          EFFECTIVE_EMAIL_SETTINGS_SECRET="${EMAIL_SETTINGS_SECRET:-$EFFECTIVE_SESSION_SECRET}"

          {
            printf 'APP_ENV=%s\n' "$APP_ENV"
            printf 'NODE_ENV=%s\n' "$NODE_ENV"
            printf 'PORT=%s\n' "$PORT"
            printf 'APP_URL=%s\n' "$APP_URL"
            printf 'NEXT_PUBLIC_APP_URL=%s\n' "$NEXT_PUBLIC_APP_URL"
            printf 'PLATFORM_ADMIN_URL=%s\n' "$PLATFORM_ADMIN_URL"
            printf 'TENANT_DOMAIN_SUFFIX=%s\n' "$TENANT_DOMAIN_SUFFIX"
            printf 'PLATFORM_HOSTNAMES=%s\n' "$PLATFORM_HOSTNAMES"
            printf 'PLATFORM_MARKETING_HOSTNAMES=%s\n' "$PLATFORM_MARKETING_HOSTNAMES"
            printf 'PLATFORM_ADMIN_HOSTNAMES=%s\n' "$PLATFORM_ADMIN_HOSTNAMES"
            printf 'STAGING_HOSTNAMES=%s\n' "$STAGING_HOSTNAMES"
            printf 'TENANT_BASE_DOMAINS=%s\n' "$TENANT_BASE_DOMAINS"
            printf 'RESERVED_TENANT_SUBDOMAINS=%s\n' "$RESERVED_TENANT_SUBDOMAINS"
            printf 'BASE_PATH=%s\n' "$BASE_PATH"
            printf 'RELEASE_COMMIT_SHA=%s\n' "$GITHUB_SHA"
            printf 'RELEASE_BUILD_TIME=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            printf 'HEALTH_CHECK_DATABASE=%s\n' "$HEALTH_CHECK_DATABASE"
            printf 'HEALTH_STRICT=%s\n' "$HEALTH_STRICT"
            printf 'REQUIRE_HEALTH_DATABASE=%s\n' "$REQUIRE_HEALTH_DATABASE"
            printf 'DATABASE_URL=%s\n' "$DATABASE_URL"
            printf 'SESSION_SECRET=%s\n' "$EFFECTIVE_SESSION_SECRET"
            printf 'JWT_SESSION=%s\n' "$JWT_SESSION"
            printf 'JWT_SECRET=%s\n' "$JWT_SECRET"
            printf 'AUTH_CODE_PEPPER=%s\n' "$AUTH_CODE_PEPPER"
            printf 'EMAIL_SETTINGS_SECRET=%s\n' "$EFFECTIVE_EMAIL_SETTINGS_SECRET"
            printf 'NEXT_PUBLIC_SUPABASE_URL=%s\n' "$NEXT_PUBLIC_SUPABASE_URL"
            printf 'NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=%s\n' "$SUPABASE_PUBLIC_KEY"
            printf 'NEXT_PUBLIC_SUPABASE_ANON_KEY=%s\n' "$NEXT_PUBLIC_SUPABASE_ANON_KEY"
            printf 'SUPABASE_SECRET_KEY=%s\n' "$SUPABASE_SERVER_SECRET"
            printf 'SUPABASE_SERVICE_ROLE_KEY=%s\n' "$SUPABASE_SERVICE_ROLE_KEY"
            printf 'RUN_DB_MIGRATIONS=%s\n' "$RUN_DB_MIGRATIONS"
            printf 'DB_MIGRATE_DRY_RUN=%s\n' "$DB_MIGRATE_DRY_RUN"
            printf 'BOOTSTRAP_PLATFORM_OWNER_EMAIL=%s\n' "$BOOTSTRAP_PLATFORM_OWNER_EMAIL"
            printf 'BOOTSTRAP_PLATFORM_OWNER_RESET_PASSWORD=%s\n' "$BOOTSTRAP_PLATFORM_OWNER_RESET_PASSWORD"
            printf 'SENDGRID_API_KEY=%s\n' "$SENDGRID_API_KEY"
            printf 'SMTP_HOST=%s\n' "$SMTP_HOST"
            printf 'SMTP_PORT=%s\n' "$SMTP_PORT"
            printf 'SMTP_USER=%s\n' "$SMTP_USER"
            printf 'SMTP_PASSWORD=%s\n' "$SMTP_PASSWORD"
            printf 'SMTP_SECURE=%s\n' "$SMTP_SECURE"
            printf 'SMTP_EHLO_HOSTNAME=%s\n' "$SMTP_EHLO_HOSTNAME"
            printf 'SMTP_FROM=%s\n' "$SMTP_FROM"
            printf 'SMTP_FROM_EMAIL=%s\n' "$SMTP_FROM_EMAIL"
            printf 'SMTP_FROM_NAME=%s\n' "$SMTP_FROM_NAME"
            printf 'EMAIL_DELIVERY_TIMEOUT_MS=%s\n' "$EMAIL_DELIVERY_TIMEOUT_MS"
          } > "$BASE_DIR/shared/.env"

          chmod 640 "$BASE_DIR/shared/.env"
          chgrp nxttrack-deploy "$BASE_DIR/shared/.env"

          ln -sfn "$BASE_DIR/shared/.env" "$RELEASE/.env"
          ln -sfn "$BASE_DIR/shared/.env" "$RELEASE/.env.production"

      - name: Install dependencies
        working-directory: ${{ env.RELEASE }}
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile

      - name: Run hardening audits
        working-directory: ${{ env.RELEASE }}
        run: |
          set -euo pipefail
          pnpm run design:audit
          pnpm run typecheck
          pnpm run auth:audit
          pnpm run security:audit-dependencies
          pnpm run db:audit
          pnpm run db:rls-audit
          pnpm run staging:gate

      - name: Build
        working-directory: ${{ env.RELEASE }}
        run: |
          set -euo pipefail
          pnpm build
          pnpm run deploy:package-standalone-assets

      - name: Run database migrations
        working-directory: ${{ env.RELEASE }}
        run: |
          set -euo pipefail
          pnpm run db:migrate

      - name: Bootstrap platform owner
        if: env.BOOTSTRAP_PLATFORM_OWNER == 'true'
        working-directory: ${{ env.RELEASE }}
        run: |
          set -euo pipefail
          pnpm run auth:bootstrap-platform-owner

      - name: Activate release
        run: |
          set -euo pipefail

          chown -R github-runner:nxttrack-deploy "$RELEASE"
          chmod -R u+rwX,g+rX,o-rwx "$RELEASE"

          ln -sfn "$RELEASE" "$BASE_DIR/current.new"
          mv -Tf "$BASE_DIR/current.new" "$BASE_DIR/current"

          sudo systemctl restart "$SERVICE_NAME"
          sudo systemctl reload caddy

      - name: Health endpoint smoke
        working-directory: ${{ env.RELEASE }}
        run: |
          set -euo pipefail
          pnpm run staging:health

      - name: Runtime smoke
        working-directory: ${{ env.RELEASE }}
        run: |
          set -euo pipefail
          pnpm run staging:runtime-smoke

      - name: Write release evidence
        if: env.TARGET == 'production'
        working-directory: ${{ env.RELEASE }}
        run: pnpm run release:write-evidence

      - name: Upload release evidence
        if: env.TARGET == 'production'
        uses: actions/upload-artifact@v4
        with:
          name: nxttrack-${{ env.TARGET }}-${{ github.sha }}-release-evidence
          path: ${{ env.RELEASE }}/artifacts/release-evidence.json
          if-no-files-found: error
          retention-days: ${{ inputs.target == 'production' && 90 || 14 }}

      - name: Cleanup old releases
        run: |
          set -euo pipefail
          ls -1dt "$BASE_DIR/releases"/* 2>/dev/null | tail -n +6 | xargs -r rm -rf

  staging-browser-validation:
    name: staging browser validation
    if: inputs.target == 'staging'
    needs: deploy
    runs-on: ubuntu-latest
    environment: staging

    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: 1
      NODE_OPTIONS: --max-old-space-size=1536
      TARGET: staging
      RELEASE_TARGET: staging
      RELEASE_CANONICAL_BRANCH: main
      APP_ENV: staging
      NODE_ENV: production
      APP_URL: ${{ vars.APP_URL }}
      NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
      PLAYWRIGHT_BASE_URL: ${{ vars.APP_URL }}
      TENANT_DOMAIN_SUFFIX: ${{ vars.TENANT_DOMAIN_SUFFIX }}
      TENANT_BASE_DOMAINS: ${{ vars.TENANT_BASE_DOMAINS }}
      PHASE16_STATE_PATH: ${{ github.workspace }}/artifacts/phase16-state.json
      SPRINT4_EDGE_STATE_PATH: ${{ github.workspace }}/artifacts/sprint4-edge-state.json
      SPRINT4_PARENT_STATE_PATH: ${{ github.workspace }}/artifacts/sprint4-parent-state.json
      SPRINT4_ISOLATION_STATE_PATH: ${{ github.workspace }}/artifacts/sprint4-isolation-state.json
      PHASE16_TENANT_SLUG: ${{ vars.PHASE16_TENANT_SLUG }}
      PHASE16_TENANT_HOSTNAME: ${{ vars.PHASE16_TENANT_HOSTNAME }}
      PHASE16_TENANT_NAME: ${{ vars.PHASE16_TENANT_NAME }}
      PHASE16_RESET_E2E_PASSWORDS: ${{ vars.PHASE16_RESET_E2E_PASSWORDS }}
      PHASE16_SKIP_PLAYWRIGHT_INSTALL: "true"
      PHASE15_SKIP_PLAYWRIGHT_INSTALL: "true"
      RUN_DB_MIGRATIONS: "true"
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      AUTH_CODE_PEPPER: ${{ secrets.AUTH_CODE_PEPPER }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      E2E_PLATFORM_OWNER_EMAIL: ${{ secrets.E2E_PLATFORM_OWNER_EMAIL || vars.E2E_PLATFORM_OWNER_EMAIL }}
      E2E_PLATFORM_OWNER_PASSWORD: ${{ secrets.E2E_PLATFORM_OWNER_PASSWORD }}
      E2E_TENANT_ADMIN_EMAIL: ${{ secrets.E2E_TENANT_ADMIN_EMAIL || vars.E2E_TENANT_ADMIN_EMAIL }}
      E2E_TENANT_ADMIN_PASSWORD: ${{ secrets.E2E_TENANT_ADMIN_PASSWORD }}
      E2E_INSTRUCTOR_EMAIL: ${{ secrets.E2E_INSTRUCTOR_EMAIL || vars.E2E_INSTRUCTOR_EMAIL }}
      E2E_INSTRUCTOR_PASSWORD: ${{ secrets.E2E_INSTRUCTOR_PASSWORD }}
      E2E_PARENT_EMAIL: ${{ secrets.E2E_PARENT_EMAIL || vars.E2E_PARENT_EMAIL }}
      E2E_PARENT_PASSWORD: ${{ secrets.E2E_PARENT_PASSWORD }}
      E2E_ALLOW_FORCE_PASSWORD_CHANGE: ${{ vars.E2E_ALLOW_FORCE_PASSWORD_CHANGE || 'false' }}
      LOVABLE_VISUAL_CHECK_CONFIRMED: ${{ vars.LOVABLE_VISUAL_CHECK_CONFIRMED }}
      SUPABASE_BACKUPS_CONFIRMED: ${{ vars.SUPABASE_BACKUPS_CONFIRMED }}
      ROLLBACK_REHEARSAL_CONFIRMED: ${{ vars.ROLLBACK_REHEARSAL_CONFIRMED }}
      SUPABASE_ADVISOR_TYPE: ${{ vars.SUPABASE_ADVISOR_TYPE }}
      SUPABASE_ADVISOR_LEVEL: ${{ vars.SUPABASE_ADVISOR_LEVEL }}
      SUPABASE_ADVISOR_FAIL_ON: ${{ vars.SUPABASE_ADVISOR_FAIL_ON }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.24.0 --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter @nxttrack/web exec playwright install --with-deps chromium

      - name: Phase 16 operational flow validation
        run: pnpm run phase16:flow

      - name: Prepare Sprint 4 browser-mutation fixture
        run: pnpm run sprint4:prepare-mutations

      - name: Prepare Sprint 4 offer-edge fixtures
        run: pnpm run sprint4:prepare-offer-edges

      - name: Prepare Sprint 4 parent self-service fixtures
        run: pnpm run sprint4:prepare-parent

      - name: Prepare Sprint 4 tenant-admin fixtures
        run: pnpm run sprint4:prepare-admin

      - name: Prepare Sprint 4 isolation fixtures
        run: pnpm run sprint4:prepare-isolation

      - name: Sprint 4 intake-to-placement browser mutation
        env:
          SPRINT4_MUTATIONS_ENABLED: "true"
        run: pnpm run sprint4:test-mutations

      - name: Sprint 4 instructor browser mutations
        env:
          SPRINT4_INSTRUCTOR_MUTATIONS_ENABLED: "true"
        run: pnpm run sprint4:test-instructor

      - name: Sprint 4 parent self-service browser mutations
        env:
          SPRINT4_PARENT_MUTATIONS_ENABLED: "true"
        run: pnpm run sprint4:test-parent

      - name: Sprint 4 tenant-admin browser mutations
        env:
          SPRINT4_ADMIN_MUTATIONS_ENABLED: "true"
        run: pnpm run sprint4:test-admin

      - name: Sprint 4 role and tenant isolation
        env:
          SPRINT4_ISOLATION_ENABLED: "true"
        run: pnpm run sprint4:test-isolation

      - name: Sprint 4 accessibility and performance budgets
        env:
          SPRINT4_QUALITY_BUDGETS_ENABLED: "true"
        run: pnpm run sprint4:test-quality

      - name: Capture Priority A staging visual evidence
        run: pnpm run design:capture-production

      - name: Upload Priority A staging visual evidence
        if: always()
        id: upload-priority-a-visuals
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: nxttrack-staging-${{ github.sha }}-priority-a-visuals
          path: artifacts/production-baseline/${{ github.sha }}
          if-no-files-found: warn
          retention-days: 14

      - name: Emit compact visual review fallback
        if: steps.upload-priority-a-visuals.outcome == 'failure'
        continue-on-error: true
        run: pnpm run design:log-visual-review

      - name: Phase 15 staging truth and security validation
        run: pnpm run phase15:staging

      - name: Write release evidence
        run: pnpm run release:write-evidence

      - name: Upload release evidence
        id: upload-release-evidence
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: nxttrack-staging-${{ github.sha }}-release-evidence
          path: artifacts/release-evidence.json
          if-no-files-found: error
          retention-days: 14

      - name: Confirm release evidence fallback
        if: steps.upload-release-evidence.outcome == 'failure'
        run: |
          test -s artifacts/release-evidence.json
          echo "Artifact upload unavailable; release evidence is preserved in this job summary."
