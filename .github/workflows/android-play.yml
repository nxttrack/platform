name: Upload Android apps to Google Play internal

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: Monotonically increasing Play versionCode
        required: true
        type: string
      version_name:
        description: Human-readable version, for example 1.0.0
        required: true
        type: string
      confirmation:
        description: Type UPLOAD_ANDROID_INTERNAL
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: nxttrack-google-play-internal
  cancel-in-progress: false

jobs:
  authorize:
    name: Authorize bounded internal-track upload
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Validate explicit confirmation and version
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          VERSION_CODE: ${{ inputs.version_code }}
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = "UPLOAD_ANDROID_INTERNAL"
          [[ "$VERSION_CODE" =~ ^[1-9][0-9]{0,9}$ ]]
          test "$VERSION_CODE" -le 2100000000
          [[ "$VERSION_NAME" =~ ^[0-9]+(\.[0-9]+){1,3}([+-][A-Za-z0-9.-]+)?$ ]]

  verify:
    name: Verify exact native release source
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
      NXTTRACK_API_BASE_URL: ${{ vars.NATIVE_API_BASE_URL }}
    steps:
      - name: Checkout exact main revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@0723195856401067f7a2779048b490ace7a47d7c # v5

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5

      - name: Ensure Android 37 SDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager_bin=""
          for candidate in \
            "${ANDROID_SDK_ROOT:-}/cmdline-tools/latest/bin/sdkmanager" \
            "${ANDROID_HOME:-}/cmdline-tools/latest/bin/sdkmanager" \
            "$(command -v sdkmanager 2>/dev/null || true)"
          do
            if [[ -n "$candidate" && -x "$candidate" ]]; then
              sdkmanager_bin="$candidate"
              break
            fi
          done
          if [[ -z "$sdkmanager_bin" ]]; then
            echo "::error::sdkmanager was not found under ANDROID_SDK_ROOT, ANDROID_HOME, or PATH"
            exit 1
          fi
          set +o pipefail
          yes | "$sdkmanager_bin" --licenses >/dev/null
          license_exit="${PIPESTATUS[1]}"
          set -o pipefail
          test "$license_exit" -eq 0
          "$sdkmanager_bin" \
            "platform-tools" "platforms;android-37" "build-tools;37.0.0"

      - name: Validate protected API origin
        run: |
          set -euo pipefail
          [[ "$NXTTRACK_API_BASE_URL" =~ ^https://[^/]+/?$ ]]

      - name: Run complete native quality gate
        working-directory: apps/android
        run: |
          ./gradlew --no-daemon qualityGate \
            "-PNXTTRACK_API_BASE_URL=${NXTTRACK_API_BASE_URL}"

  upload:
    name: Upload ${{ matrix.app }} to Play internal
    needs:
      - authorize
      - verify
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: google-play-internal
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: instructor
            module: instructor-app
            packageName: nl.nxttrack.instructor
            keystoreSecret: ANDROID_INSTRUCTOR_UPLOAD_KEYSTORE_BASE64
            storePasswordSecret: ANDROID_INSTRUCTOR_UPLOAD_STORE_PASSWORD
            keyAliasSecret: ANDROID_INSTRUCTOR_UPLOAD_KEY_ALIAS
            keyPasswordSecret: ANDROID_INSTRUCTOR_UPLOAD_KEY_PASSWORD
            playSecret: GOOGLE_PLAY_INSTRUCTOR_SERVICE_ACCOUNT_JSON
            propertyPrefix: NXTTRACK_INSTRUCTOR
          - app: parent
            module: parent-app
            packageName: nl.nxttrack.parent
            keystoreSecret: ANDROID_PARENT_UPLOAD_KEYSTORE_BASE64
            storePasswordSecret: ANDROID_PARENT_UPLOAD_STORE_PASSWORD
            keyAliasSecret: ANDROID_PARENT_UPLOAD_KEY_ALIAS
            keyPasswordSecret: ANDROID_PARENT_UPLOAD_KEY_PASSWORD
            playSecret: GOOGLE_PLAY_PARENT_SERVICE_ACCOUNT_JSON
            propertyPrefix: NXTTRACK_PARENT
    env:
      CI: true
      NXTTRACK_API_BASE_URL: ${{ vars.NATIVE_API_BASE_URL }}
      UPLOAD_KEYSTORE_BASE64: ${{ secrets[matrix.keystoreSecret] }}
      UPLOAD_STORE_PASSWORD: ${{ secrets[matrix.storePasswordSecret] }}
      UPLOAD_KEY_ALIAS: ${{ secrets[matrix.keyAliasSecret] }}
      UPLOAD_KEY_PASSWORD: ${{ secrets[matrix.keyPasswordSecret] }}
    steps:
      - name: Checkout exact main revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@0723195856401067f7a2779048b490ace7a47d7c # v5

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5

      - name: Ensure Android 37 SDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager_bin=""
          for candidate in \
            "${ANDROID_SDK_ROOT:-}/cmdline-tools/latest/bin/sdkmanager" \
            "${ANDROID_HOME:-}/cmdline-tools/latest/bin/sdkmanager" \
            "$(command -v sdkmanager 2>/dev/null || true)"
          do
            if [[ -n "$candidate" && -x "$candidate" ]]; then
              sdkmanager_bin="$candidate"
              break
            fi
          done
          if [[ -z "$sdkmanager_bin" ]]; then
            echo "::error::sdkmanager was not found under ANDROID_SDK_ROOT, ANDROID_HOME, or PATH"
            exit 1
          fi
          set +o pipefail
          yes | "$sdkmanager_bin" --licenses >/dev/null
          license_exit="${PIPESTATUS[1]}"
          set -o pipefail
          test "$license_exit" -eq 0
          "$sdkmanager_bin" \
            "platform-tools" "platforms;android-37" "build-tools;37.0.0"

      - name: Validate protected release inputs
        run: |
          set -euo pipefail
          [[ "$NXTTRACK_API_BASE_URL" =~ ^https://[^/]+/?$ ]]
          test -n "$UPLOAD_KEYSTORE_BASE64"
          test -n "$UPLOAD_STORE_PASSWORD"
          test -n "$UPLOAD_KEY_ALIAS"
          test -n "$UPLOAD_KEY_PASSWORD"

      - name: Materialize scoped upload key
        id: signing
        shell: bash
        run: |
          set -euo pipefail
          upload_store="${RUNNER_TEMP}/${{ matrix.app }}-upload.jks"
          printf '%s' "$UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$upload_store"
          chmod 600 "$upload_store"
          echo "path=$upload_store" >> "$GITHUB_OUTPUT"

      - name: Test and build signed app bundle
        working-directory: apps/android
        env:
          PROPERTY_PREFIX: ${{ matrix.propertyPrefix }}
          UPLOAD_STORE_FILE: ${{ steps.signing.outputs.path }}
        run: |
          set -euo pipefail
          ./gradlew --no-daemon \
            :${{ matrix.module }}:lintRelease \
            :${{ matrix.module }}:testReleaseUnitTest \
            :${{ matrix.module }}:bundleRelease \
            "-PNXTTRACK_API_BASE_URL=${NXTTRACK_API_BASE_URL}" \
            "-PNXTTRACK_VERSION_CODE=${{ inputs.version_code }}" \
            "-PNXTTRACK_VERSION_NAME=${{ inputs.version_name }}" \
            "-P${PROPERTY_PREFIX}_UPLOAD_STORE_FILE=${UPLOAD_STORE_FILE}" \
            "-P${PROPERTY_PREFIX}_UPLOAD_STORE_PASSWORD=${UPLOAD_STORE_PASSWORD}" \
            "-P${PROPERTY_PREFIX}_UPLOAD_KEY_ALIAS=${UPLOAD_KEY_ALIAS}" \
            "-P${PROPERTY_PREFIX}_UPLOAD_KEY_PASSWORD=${UPLOAD_KEY_PASSWORD}"

      - name: Verify AAB upload signature
        shell: bash
        env:
          AAB_PATH: apps/android/${{ matrix.module }}/build/outputs/bundle/release/${{ matrix.module }}-release.aab
        run: |
          set -euo pipefail
          verification="$(jarsigner -verify -strict -verbose -certs "$AAB_PATH" 2>&1)"
          printf '%s\n' "$verification"
          grep -Fq "jar verified." <<<"$verification"
          if grep -Fq "jar is unsigned" <<<"$verification"; then
            exit 1
          fi

      - name: Attest exact signed bundle
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: apps/android/${{ matrix.module }}/build/outputs/bundle/release/${{ matrix.module }}-release.aab

      - name: Upload signed bundle to Google Play internal
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets[matrix.playSecret] }}
          packageName: ${{ matrix.packageName }}
          releaseFiles: apps/android/${{ matrix.module }}/build/outputs/bundle/release/${{ matrix.module }}-release.aab
          track: internal
          status: completed
          releaseName: ${{ inputs.version_name }} (${{ inputs.version_code }})
          whatsNewDirectory: apps/android/${{ matrix.module }}/distribution/whatsnew

      - name: Retain signed upload evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: play-internal-${{ matrix.app }}-${{ inputs.version_code }}-${{ github.sha }}
          path: |
            apps/android/${{ matrix.module }}/build/outputs/bundle/release/*.aab
            apps/android/${{ matrix.module }}/build/reports/
          if-no-files-found: error
          retention-days: 30
