name: Temporary staging runtime diagnostic

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type CAPTURE_STAGING_RUNTIME_DIAGNOSTIC
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: nxttrack-staging-runtime-diagnostic
  cancel-in-progress: false

jobs:
  diagnose:
    if: github.ref_name == 'main'
    runs-on: [self-hosted, linux, x64, nxttrack]
    environment: staging
    env:
      APP_URL: ${{ vars.APP_URL }}
      SERVICE_NAME: ${{ vars.SERVICE_NAME || 'nxttrack-staging' }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Authorize bounded diagnostic
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: test "$CONFIRMATION" = "CAPTURE_STAGING_RUNTIME_DIAGNOSTIC"

      - name: Reproduce private media route failure
        run: |
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "${APP_URL%/}/portaal/media")"
          echo "Unauthenticated /portaal/media status: $status"

      - name: Validate media REST schema without reading rows
        run: |
          set -euo pipefail

          check_contract() {
            label="$1"
            path="$2"
            response_file="$RUNNER_TEMP/${label}.json"
            status="$(
              curl --silent --show-error \
                --header "apikey: $SUPABASE_SECRET_KEY" \
                --header "Authorization: Bearer $SUPABASE_SECRET_KEY" \
                --output "$response_file" \
                --write-out '%{http_code}' \
                "${NEXT_PUBLIC_SUPABASE_URL%/}/rest/v1/${path}"
            )"

            if [[ "$status" == 2* ]]; then
              echo "$label contract: HTTP $status"
              return
            fi

            echo "::error::$label contract returned HTTP $status"
            jq '{code, message, hint, details}' "$response_file"
            return 1
          }

          check_contract participant_guardians 'participant_guardians?select=participant_id,access_level&limit=0'
          check_contract participants 'participants?select=id,display_name,guardian_user_id,is_test&limit=0'
          check_contract participant_media 'participant_media?select=id,tenant_id,participant_id,caption,storage_bucket,storage_path,file_name,mime_type,size_bytes,malware_scan_status,download_allowed,status,consent_checked_at,published_at,expires_at,created_at&limit=0'
          check_contract media_consents 'media_consents?select=participant_id,guardian_user_id,status,expires_at,updated_at&limit=0'

      - name: Emit only redacted relevant service errors
        if: always()
        run: |
          set -o pipefail
          systemctl status \
            "$SERVICE_NAME" \
            --no-pager \
            --full \
            --lines=200 |
            grep -Ei 'participant.media|media.consents|participant.guardians|PGRST|Supabase admin|Could not find|Kon .* laden|Internal Server Error|Error:|digest|failed|⨯' |
            sed -E \
              -e 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/[email]/g' \
              -e 's/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}/[uuid]/g' \
              -e 's/(Bearer )[A-Za-z0-9._~+\/=-]+/\1[redacted]/g' \
              -e 's/((token|code|secret|key)=)[^&[:space:]]+/\1[redacted]/gi' |
            tail -n 120

  reproduce-in-development:
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    environment: staging
    env:
      APP_ENV: staging
      NODE_ENV: development
      PORT: 3901
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3901
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SESSION_SECRET: ${{ secrets.SESSION_SECRET || secrets.JWT_SESSION }}
      TENANT_DOMAIN_SUFFIX: staging.nxttrack.nl
      TENANT_BASE_DOMAINS: staging.nxttrack.nl
    steps:
      - name: Authorize isolated reproduction
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: test "$CONFIRMATION" = "CAPTURE_STAGING_RUNTIME_DIAGNOSTIC"

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24.18.0"

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.24.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Reproduce and emit redacted development error
        run: |
          set -euo pipefail
          log_file="$RUNNER_TEMP/nxttrack-media-dev.log"
          pnpm --filter @nxttrack/web exec next dev --hostname 127.0.0.1 --port 3901 > "$log_file" 2>&1 &
          dev_pid="$!"
          trap 'kill "$dev_pid" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 60); do
            status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3901/portaal/media || true)"
            if [ "$status" != "000" ]; then
              echo "Development /portaal/media status: $status"
              break
            fi
            sleep 1
          done

          sed -E \
            -e 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/[email]/g' \
            -e 's/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}/[uuid]/g' \
            -e 's/(Bearer )[A-Za-z0-9._~+\/=-]+/\1[redacted]/g' \
            -e 's/((token|code|secret|key)=)[^&[:space:]]+/\1[redacted]/gi' \
            "$log_file" |
            tail -n 180
