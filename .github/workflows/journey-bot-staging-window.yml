name: Journey Bot staging window

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type START_WATERLIJN_JOURNEY_WINDOW
        required: true
        type: string
      duration_hours:
        description: Runtime in hours (hard stop)
        required: true
        default: "2"
        type: string
      journey_budget:
        description: Secondary maximum number of journeys
        required: true
        default: "30"
        type: string
      batch_size:
        description: Full journeys processed per tick (maximum 25)
        required: true
        default: "1"
        type: string

permissions:
  contents: read

concurrency:
  group: nxttrack-journey-bot-staging-window
  cancel-in-progress: false

jobs:
  start:
    name: run bounded Waterlijn journey window
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 135
    environment: staging
    env:
      APP_URL: ${{ vars.APP_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      JOURNEY_BOT_WINDOW_CONTROL: true
      JOURNEY_BOT_WINDOW_HOURS: ${{ inputs.duration_hours }}
      JOURNEY_BOT_WINDOW_BUDGET: ${{ inputs.journey_budget }}
      JOURNEY_BOT_WINDOW_BATCH_SIZE: ${{ inputs.batch_size }}
      PLAYWRIGHT_BASE_URL: ${{ vars.APP_URL }}
      E2E_PLATFORM_OWNER_EMAIL: ${{ secrets.E2E_PLATFORM_OWNER_EMAIL || vars.E2E_PLATFORM_OWNER_EMAIL }}
      E2E_PLATFORM_OWNER_PASSWORD: ${{ secrets.E2E_PLATFORM_OWNER_PASSWORD }}
    steps:
      - name: Authorize bounded staging mutation
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = "START_WATERLIJN_JOURNEY_WINDOW"
          test "$JOURNEY_BOT_WINDOW_HOURS" -ge 1
          test "$JOURNEY_BOT_WINDOW_HOURS" -le 24
          test "$JOURNEY_BOT_WINDOW_BUDGET" -ge 1
          test "$JOURNEY_BOT_WINDOW_BUDGET" -le 100
          test "$JOURNEY_BOT_WINDOW_BATCH_SIZE" -ge 1
          test "$JOURNEY_BOT_WINDOW_BATCH_SIZE" -le 25
          case "$PLAYWRIGHT_BASE_URL" in
            https://staging.nxttrack.nl|https://*.staging.nxttrack.nl) ;;
            *) echo "Refusing non-staging URL: $PLAYWRIGHT_BASE_URL"; exit 1 ;;
          esac

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24.18.0"

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.24.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter @nxttrack/web exec playwright install --with-deps chromium

      - name: Start controlled journey window
        run: pnpm --filter @nxttrack/web exec playwright test tests/e2e/journey-bot-window-control.spec.ts --project=chromium-desktop --retries=0

      - name: Process and evaluate five-minute ticks
        run: |
          set -euo pipefail
          if [ "${#CRON_SECRET}" -lt 32 ]; then
            echo "A staging CRON_SECRET of at least 32 characters is required."
            exit 1
          fi
          mkdir -p artifacts/journey-bot-window
          deadline=$(( $(date +%s) + JOURNEY_BOT_WINDOW_HOURS * 3600 ))
          iteration=0
          while true; do
            remaining=$(( deadline - $(date +%s) ))
            if [ "$remaining" -le 0 ]; then
              break
            fi
            sleep_for=300
            if [ "$remaining" -lt "$sleep_for" ]; then
              sleep_for="$remaining"
            fi
            sleep "$sleep_for"
            iteration=$(( iteration + 1 ))
            response_file="artifacts/journey-bot-window/tick-$(printf '%03d' "$iteration").json"
            curl --fail-with-body \
              --silent \
              --show-error \
              --request POST \
              --header "Authorization: Bearer $CRON_SECRET" \
              --output "$response_file" \
              "$APP_URL/api/internal/journey-bot/tick"
            node scripts/staging/assert-journey-bot-tick.mjs "$response_file"
          done

      - name: Upload window evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: journey-bot-window-${{ github.sha }}
          path: |
            artifacts/journey-bot-window
            apps/web/test-results
            apps/web/playwright-report
          if-no-files-found: ignore
          retention-days: 14
