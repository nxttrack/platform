name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20.19.0"

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.24.0 --activate
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit repository truth
        run: pnpm run release:truth

      - name: Audit Lovable baseline contract
        run: pnpm run design:audit

      - name: Typecheck
        run: pnpm typecheck

      - name: Test billing provider contracts
        run: pnpm run test:billing-contract

      - name: Test Journey Bot safety contracts
        run: pnpm run test:journey-bot

      - name: Test Communicationhub contracts
        run: pnpm run test:communication-hub

      - name: Test premium badge contracts
        run: pnpm run test:badges

      - name: Test swim-school canon and native API contracts
        run: pnpm run test:swim-canon

      - name: Test parent and child portal security contracts
        run: pnpm run test:parent-child-portals

      - name: Audit Journey Bot foundation
        run: pnpm run release:audit-journey-bot

      - name: Audit runtime environment contract
        run: pnpm run release:audit-runtime-env

      - name: Audit auth boundaries
        run: pnpm run auth:audit

      - name: Audit production dependencies
        run: pnpm run security:audit-dependencies

      - name: Build
        run: pnpm build

      - name: Audit migrations
        run: pnpm run db:audit

      - name: Audit RLS coverage
        run: pnpm run db:rls-audit

      - name: Check migration command
        run: pnpm run db:migrate

      - name: Package standalone runtime assets
        run: pnpm run deploy:package-standalone-assets

      - name: Install Playwright browser engines
        run: pnpm --filter @nxttrack/web exec playwright install --with-deps chromium firefox webkit

      - name: Run browser smoke tests
        run: pnpm run test:e2e

      - name: Validate Journey timeline in Chromium Firefox and WebKit
        run: pnpm run test:journey:e2e

      - name: Upload Journey timeline evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: nxttrack-${{ github.sha }}-journey-timeline-evidence
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: warn
          retention-days: 14
