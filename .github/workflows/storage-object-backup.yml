name: Storage object backup

on:
  workflow_dispatch:
    inputs:
      target:
        description: Environment to export
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production
      confirmation:
        description: Type BACKUP_STAGING_STORAGE or BACKUP_PRODUCTION_STORAGE
        required: true
        type: string
      first_install_empty_project:
        description: Allow all required buckets to be absent before the first production migration only
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: nxttrack-${{ inputs.target }}-storage-object-backup
  cancel-in-progress: false

jobs:
  backup:
    name: export and encrypt private Storage objects
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    env:
      APP_ENV: ${{ inputs.target }}
      APP_URL: ${{ vars.APP_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
      STORAGE_BACKUP_PASSPHRASE: ${{ secrets.STORAGE_BACKUP_PASSPHRASE }}
      STORAGE_BACKUP_ALLOW_EMPTY_FIRST_INSTALL: ${{ inputs.first_install_empty_project && 'true' || 'false' }}
      STORAGE_BACKUP_DEFER_SUCCESS_HEARTBEAT: "true"
    steps:
      - name: Authorize scoped export
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          FIRST_INSTALL_EMPTY_PROJECT: ${{ inputs.first_install_empty_project }}
          TARGET: ${{ inputs.target }}
        run: |
          if [[ "$TARGET" == "production" ]]; then
            test "$CONFIRMATION" = "BACKUP_PRODUCTION_STORAGE"
          else
            test "$CONFIRMATION" = "BACKUP_STAGING_STORAGE"
            test "$FIRST_INSTALL_EMPTY_PROJECT" != "true"
          fi

      - name: Require independently retained encryption secret
        run: |
          test -n "$STORAGE_BACKUP_PASSPHRASE"
          test "${#CRON_SECRET}" -ge 32
          test -n "$APP_URL"

      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare isolated backup directory
        run: |
          umask 077
          backup_work_dir=$(mktemp -d "${RUNNER_TEMP}/storage-backup-XXXXXXXX")
          echo "STORAGE_BACKUP_WORK_DIR=$backup_work_dir" >> "$GITHUB_ENV"
          echo "STORAGE_BACKUP_DIR=$backup_work_dir/objects" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24.18.0"

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.24.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Export and verify all private buckets
        id: export
        run: |
          pnpm run storage:backup
          pnpm run storage:verify-local
          node scripts/storage/object-backup.mjs summary > "$STORAGE_BACKUP_WORK_DIR/storage-backup-summary.json"

      - name: Encrypt and byte-verify backup before retention
        id: encrypt
        run: node scripts/storage/retained-backup.mjs encrypt

      - name: Retain encrypted backup
        id: retain
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.target }}-storage-object-backup-${{ github.run_id }}
          path: |
            ${{ env.STORAGE_BACKUP_WORK_DIR }}/storage-backup.tar.gz.gpg
            ${{ env.STORAGE_BACKUP_WORK_DIR }}/storage-backup-summary.json
            ${{ env.STORAGE_BACKUP_WORK_DIR }}/encryption-proof.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Record successful retention after artifact upload
        id: heartbeat
        env:
          STORAGE_BACKUP_ARTIFACT_ID: ${{ steps.retain.outputs.artifact-id }}
          STORAGE_BACKUP_ARTIFACT_DIGEST: ${{ steps.retain.outputs.artifact-digest }}
        run: node scripts/storage/retained-backup.mjs pass

      - name: Record failed or cancelled backup
        if: ${{ always() && (failure() || cancelled()) && steps.export.outcome != 'skipped' && steps.export.outcome != '' }}
        env:
          STORAGE_BACKUP_FAILED_STAGE: ${{ cancelled() && 'cancelled' || steps.export.outcome == 'failure' && 'export' || steps.encrypt.outcome == 'failure' && 'encrypt' || steps.retain.outcome == 'failure' && 'upload' || 'heartbeat' }}
        run: node scripts/storage/retained-backup.mjs fail

      - name: Remove all temporary backup material
        if: always()
        run: |
          if [[ -n "${STORAGE_BACKUP_WORK_DIR:-}" ]]; then
            case "$STORAGE_BACKUP_WORK_DIR" in
              "$RUNNER_TEMP"/storage-backup-*) rm -rf -- "$STORAGE_BACKUP_WORK_DIR" ;;
              *) echo "Refusing cleanup outside the isolated backup directory." >&2; exit 1 ;;
            esac
          fi
