name: Staging rollback rehearsal

on:
  workflow_dispatch:
    inputs:
      release_directory:
        description: Absolute path of the previously validated staging release
        required: true
        type: string
      check_only:
        description: Validate the target without switching the live runtime
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: nxttrack-staging
  cancel-in-progress: false

jobs:
  rehearse:
    if: github.ref_name == 'main'
    runs-on: [self-hosted, linux, x64, nxttrack]
    environment: staging

    env:
      ROLLBACK_BASE_DIR: /var/www/nxttrack/staging
      ROLLBACK_SERVICE_NAME: ${{ vars.SERVICE_NAME || 'nxttrack-staging' }}
      ROLLBACK_HEALTH_URL: ${{ vars.APP_URL }}/api/health

    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup certified Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.0

      - name: Rehearse previous release and restore current release
        env:
          ROLLBACK_CANDIDATE: ${{ inputs.release_directory }}
          ROLLBACK_CHECK_ONLY: ${{ inputs.check_only }}
        run: |
          if [[ "$ROLLBACK_CHECK_ONLY" == true ]]; then
            scripts/release/rehearse-runtime-rollback.sh staging "$ROLLBACK_CANDIDATE" --check-only
          else
            scripts/release/rehearse-runtime-rollback.sh staging "$ROLLBACK_CANDIDATE"
          fi
