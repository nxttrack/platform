name: Daily swim analytics projections

on:
  schedule:
    - cron: "45 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  project:
    name: project ${{ matrix.environment }} swim analytics
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment:
          - staging
          - production
    concurrency:
      group: nxttrack-swim-analytics-${{ matrix.environment }}
      cancel-in-progress: false
    environment: ${{ matrix.environment }}
    env:
      APP_URL: ${{ vars.APP_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Check internal jobs release gate
        id: release_gate
        env:
          INTERNAL_JOBS_ENABLED: ${{ vars.INTERNAL_JOBS_ENABLED }}
        run: |
          if [ "$INTERNAL_JOBS_ENABLED" != "true" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Internal jobs are disabled for ${{ matrix.environment }} until its matching release is deployed."
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Validate protected endpoint configuration
        if: steps.release_gate.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          if [ "${#CRON_SECRET}" -lt 32 ]; then
            echo "::error::CRON_SECRET must contain at least 32 characters."
            exit 1
          fi
          case "${{ matrix.environment }}:$APP_URL" in
            staging:https://staging.nxttrack.nl|staging:https://*.staging.nxttrack.nl) ;;
            production:https://nxttrack.nl|production:https://*.nxttrack.nl) ;;
            *) echo "::error::Refusing unexpected APP_URL for ${{ matrix.environment }}: $APP_URL"; exit 1 ;;
          esac

      - name: Reconcile events, snapshots and forecasts
        if: steps.release_gate.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          response_file="$RUNNER_TEMP/swim-analytics.json"
          curl --fail-with-body \
            --silent \
            --show-error \
            --request POST \
            --header "Authorization: Bearer $CRON_SECRET" \
            --header "Content-Type: application/json" \
            --data '{}' \
            --output "$response_file" \
            "$APP_URL/api/internal/analytics/swim/refresh"
          cat "$response_file"
          accepted="$(jq -r '.accepted // false' "$response_file")"
          failed="$(jq -r '.failed // 1' "$response_file")"
          if [ "$accepted" != "true" ] || [ "$failed" != "0" ]; then
            echo "::error::Swim analytics projection cycle did not complete cleanly."
            exit 1
          fi
