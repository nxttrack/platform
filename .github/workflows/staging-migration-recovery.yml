name: Staging migration recovery

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact canonical main SHA whose migrations may be applied
        required: true
        type: string
      confirmation:
        description: Type APPLY_STAGING_MIGRATIONS to run the migration-only recovery
        required: true
        type: string
      out_of_order_confirmation:
        description: Type ALLOW_STAGING_OUT_OF_ORDER_MIGRATIONS to use Supabase's supported include-all mode
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: nxttrack-staging-migration-recovery
  cancel-in-progress: false

jobs:
  recover:
    name: apply staging migrations without application activation
    if: github.ref_name == 'main'
    runs-on: [self-hosted, linux, x64, nxttrack]
    environment: staging

    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: 1
      NODE_OPTIONS: --max-old-space-size=3072
      TARGET: staging
      RELEASE_TARGET: staging
      RELEASE_SHA: ${{ inputs.release_sha }}
      OUT_OF_ORDER_CONFIRMATION: ${{ inputs.out_of_order_confirmation }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      APP_URL: ${{ vars.APP_URL }}
      SERVICE_NAME: ${{ vars.SERVICE_NAME || 'nxttrack-staging' }}
      BASE_DIR: /var/www/nxttrack/staging
      MAINTENANCE_NO_WRITE: ${{ vars.MAINTENANCE_NO_WRITE || 'false' }}
      EMAIL_SENDING_ENABLED: ${{ vars.EMAIL_SENDING_ENABLED || 'false' }}
      NEWSLETTER_DELIVERY_ENABLED: ${{ vars.NEWSLETTER_DELIVERY_ENABLED || 'false' }}
      INTERNAL_JOBS_ENABLED: ${{ vars.INTERNAL_JOBS_ENABLED || 'false' }}
      RUN_DB_MIGRATIONS: true
      DB_MIGRATION_REPAIR_EXISTING_SCHEMA: false
      DB_MIGRATE_DRY_RUN: false
      # Staging already recorded later retirement migrations. This is the
      # supported Supabase mode for applying the one immutable historical gap
      # plus the current missing migrations; it does not edit migration history.
      DB_MIGRATE_INCLUDE_ALL: true

    steps:
      - name: Confirm recovery request
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: test "$CONFIRMATION" = "APPLY_STAGING_MIGRATIONS"

      - name: Confirm supported out-of-order migration mode
        env:
          OUT_OF_ORDER_CONFIRMATION: ${{ inputs.out_of_order_confirmation }}
        run: test "$OUT_OF_ORDER_CONFIRMATION" = "ALLOW_STAGING_OUT_OF_ORDER_MIGRATIONS"

      - name: Checkout exact canonical release source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0

      - name: Verify exact canonical main source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          git fetch --no-tags origin main --depth=1
          test "$(git rev-parse FETCH_HEAD)" = "$RELEASE_SHA"
          echo "[staging-recovery] source SHA=$RELEASE_SHA"

      - name: Setup certified Node
        uses: actions/setup-node@v6
        with:
          node-version: "24.18.0"

      - name: Setup certified pnpm
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.24.0 --activate
          test "$(node --version)" = "v24.18.0"
          test "$(pnpm --version)" = "10.24.0"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Guard migration containment
        run: |
          set -euo pipefail
          test "$MAINTENANCE_NO_WRITE" = "true"
          test "$EMAIL_SENDING_ENABLED" = "false"
          test "$NEWSLETTER_DELIVERY_ENABLED" = "false"
          test "$INTERNAL_JOBS_ENABLED" = "false"
          test "$DB_MIGRATION_REPAIR_EXISTING_SCHEMA" = "false"

      - name: Restart old release into maintenance containment
        run: |
          set -euo pipefail
          sudo systemctl restart "$SERVICE_NAME"
          for attempt in {1..20}; do
            status="$(curl --silent --show-error --output /tmp/nxttrack-maintenance-response --write-out '%{http_code}' \
              --request POST --max-time 10 "$APP_URL/api/internal/email-outbox/process" || true)"
            if [[ "$status" == "503" ]] && grep -q 'maintenance_no_write' /tmp/nxttrack-maintenance-response; then
              echo "[staging-recovery] maintenance containment PASS"
              break
            fi
            if [[ "$attempt" == "20" ]]; then
              echo "[staging-recovery] maintenance containment was not proven" >&2
              exit 1
            fi
            sleep 3
          done

      - name: Run read-only upgrade preflight
        env:
          UPGRADE_PREFLIGHT_DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm run db:preflight-production-readiness-upgrade

      - name: Apply official staging migrations
        run: pnpm run db:migrate

      - name: Run post-migration read-only upgrade preflight
        env:
          UPGRADE_PREFLIGHT_DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm run db:preflight-production-readiness-upgrade

      - name: Assert complete runtime schema before activation
        env:
          DEPLOYED_SOURCE_SHA: ${{ inputs.release_sha }}
        run: pnpm run release:assert-schema-compatibility

      - name: Record migration parity without writes
        run: pnpm run db:inventory-production-read-only

      - name: Explicitly confirm no application activation
        run: |
          echo "[staging-recovery] PASS migrations only; no release activation, Caddy reload or application deployment was performed by this workflow."
