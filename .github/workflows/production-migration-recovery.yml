name: Production migration recovery

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact canonical main SHA whose migrations may be applied
        required: true
        type: string
      staging_release_sha:
        description: Full SHA already validated on staging and equal to release_sha
        required: true
        type: string
      confirmation:
        description: Operation confirmation, including RESTORE_STAGING_RELEASE_EVIDENCE for historical staging evidence
        required: true
        type: string
      production_approval_reference:
        description: Link or identifier for the recorded production approval
        required: true
        type: string
      production_foundation_run_id:
        description: Successful production foundation audit run ID for this exact SHA
        required: true
        type: string
      production_migration_rehearsal_run_id:
        description: Successful production migration rehearsal run ID for this exact SHA
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: nxttrack-production-migration-recovery
  cancel-in-progress: false

jobs:
  backup-current-v4-database:
    name: retain verified encrypted current V4 production database
    if: inputs.confirmation == 'BACKUP_CURRENT_V4_DATABASE'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    concurrency:
      group: nxttrack-production
      cancel-in-progress: false
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: "24.18.0"
      - name: Export the current production schema and data without database writes
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          OPERATION_SOURCE_SHA: ${{ github.sha }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          STORAGE_BACKUP_PASSPHRASE: ${{ secrets.STORAGE_BACKUP_PASSPHRASE }}
          BACKUP_OUTPUT: ${{ runner.temp }}/current-v4-db-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          umask 077
          private_dir=$(mktemp -d "$RUNNER_TEMP/current-v4-db-private.XXXXXX")
          export BACKUP_PRIVATE="$private_dir"
          export DUMP_CONTAINER="nxttrack-v4-dump-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          export LIST_CONTAINER="nxttrack-v4-list-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          cleanup() {
            docker rm --force "$DUMP_CONTAINER" "$LIST_CONTAINER" >/dev/null 2>&1 || true
            rm -rf -- "$private_dir"
          }
          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {spawnSync} from 'node:child_process';
          import {createHash} from 'node:crypto';
          import {closeSync,createReadStream,mkdirSync,openSync,renameSync,rmSync,statSync,writeFileSync} from 'node:fs';
          import {join} from 'node:path';
          const privateDir=process.env.BACKUP_PRIVATE, output=process.env.BACKUP_OUTPUT;
          const schemas=['public','app_private','auth','storage','supabase_migrations','extensions'];
          let stage='configuration';
          function execute(command,args,{timeout=60000,env=process.env,stdio=['ignore','pipe','pipe'],rejectStderr=false}={}) {
            const result=spawnSync(command,args,{env,stdio,timeout,killSignal:'SIGTERM',maxBuffer:16*1024*1024});
            assert.ok(!result.error && result.status===0 && (!rejectStderr || !result.stderr?.length),'Backup command failed.');
            return result.stdout;
          }
          async function fileHash(path) {
            const hash=createHash('sha256');
            for await (const chunk of createReadStream(path)) hash.update(chunk);
            return hash.digest('hex');
          }
          async function health() {
            const response=await fetch('https://nxttrack.nl/api/health',{redirect:'error',signal:AbortSignal.timeout(15000)});
            assert.ok(response.status===200 && response.body,'Production health is unavailable.');
            const chunks=[];let size=0;
            for await (const chunk of response.body) { size+=chunk.length; assert.ok(size<=65536,'Health response is too large.'); chunks.push(chunk); }
            const value=JSON.parse(Buffer.concat(chunks).toString('utf8'));
            assert.ok(value.ok && value.app==='nxttrack-platform' && value.env==='production'
              && value.commitSha===process.env.RELEASE_SHA && value.checks?.database?.status==='pass'
              && value.checks?.schemaCompatibility?.status==='pass','Production health does not match the required release.');
            return {commitSha:value.commitSha,database:'pass',schemaCompatibility:'pass'};
          }
          try {
            assert.match(process.env.RELEASE_SHA || '',/^[a-f0-9]{40}$/);
            assert.match(process.env.OPERATION_SOURCE_SHA || '',/^[a-f0-9]{40}$/);
            const passphrase=process.env.STORAGE_BACKUP_PASSPHRASE || '';
            assert.ok(Buffer.byteLength(passphrase)>=32 && !/[\r\n\0]/.test(passphrase),'Invalid backup key.');
            const url=new URL(process.env.DATABASE_URL);
            assert.ok(['postgres:','postgresql:'].includes(url.protocol));
            const pg={PGHOST:url.hostname,PGPORT:url.port || '5432',PGUSER:decodeURIComponent(url.username),
              PGPASSWORD:decodeURIComponent(url.password),PGDATABASE:decodeURIComponent(url.pathname.slice(1)),
              PGSSLMODE:'require',PGCONNECT_TIMEOUT:'15',PGOPTIONS:'-c default_transaction_read_only=on -c statement_timeout=240000'};
            assert.ok(Object.values(pg).every(value=>value && !/[\r\n\0]/.test(value)));
            stage='initial-health';const before=await health(), startedAt=new Date().toISOString();
            stage='postgres-tooling';execute('docker',['pull','postgres:17'],{timeout:120000});
            const dump=join(privateDir,'production-current-v4.dump'), decrypted=join(privateDir,'verified.dump');
            const key=join(privateDir,'passphrase'), encrypted=join(privateDir,'production-current-v4.dump.gpg');
            const gpgHome=join(privateDir,'gnupg');mkdirSync(gpgHome,{mode:0o700});
            writeFileSync(key,passphrase,{mode:0o600,flag:'wx'});
            stage='read-only-export';const dumpFd=openSync(dump,'wx',0o600);
            try {
              execute('docker',['run','--rm','--name',process.env.DUMP_CONTAINER,...Object.keys(pg).flatMap(name=>['-e',name]),
                'postgres:17','pg_dump','--format=custom','--no-owner','--no-acl','--lock-wait-timeout=15000',
                ...schemas.map(name=>`--schema=${name}`)],{timeout:300000,env:{...process.env,...pg},stdio:['ignore',dumpFd,'pipe'],rejectStderr:true});
            } finally { closeSync(dumpFd); }
            assert.ok(statSync(dump).size>0,'Database export is empty.');
            stage='archive-inspection';const dumpInput=openSync(dump,'r');let contents;
            try {
              contents=execute('docker',['run','--rm','-i','--name',process.env.LIST_CONTAINER,'postgres:17','pg_restore','--list'],
                {stdio:[dumpInput,'pipe','pipe']}).toString('utf8');
            } finally { closeSync(dumpInput); }
            assert.ok(contents.includes('Format: CUSTOM') && /\bTABLE DATA auth users\b/.test(contents)
              && /\bTABLE DATA supabase_migrations schema_migrations\b/.test(contents),'Archive lacks required recovery data.');
            for (const schema of schemas) assert.ok(new RegExp(`\\bSCHEMA - ${schema}\\b`).test(contents),'Archive lacks a required schema.');
            stage='encryption';const gpg=['--homedir',gpgHome,'--batch','--yes','--pinentry-mode','loopback','--passphrase-file',key];
            execute('gpg',[...gpg,'--symmetric','--cipher-algo','AES256','--output',encrypted,dump],{timeout:120000});
            stage='decryption-verification';execute('gpg',[...gpg,'--output',decrypted,'--decrypt',encrypted],{timeout:120000});
            execute('cmp',['--',dump,decrypted]);
            const dumpSha256=await fileHash(dump),encryptedSha256=await fileHash(encrypted);
            stage='final-health';const after=await health();
            assert.equal(after.commitSha,before.commitSha);
            const report={schemaVersion:1,purpose:'current-v4-production-database-backup',target:'production',
              sourceSha:process.env.OPERATION_SOURCE_SHA,requestedReleaseSha:process.env.RELEASE_SHA,
              activeRuntimeSha:after.commitSha,workflowRunId:process.env.GITHUB_RUN_ID,startedAt,completedAt:new Date().toISOString(),
              schemas,postgresMajor:17,format:'custom',databaseReadOnly:true,archiveInspection:'passed',
              decryptedBytesEqual:true,healthBefore:before,healthAfter:after,dumpSha256,encryptedSha256,
              restoreExecuted:false,scope:'Selected schema definitions and data, including auth users; excludes global database roles and Storage object bytes.'};
            rmSync(dump);rmSync(decrypted);rmSync(key);rmSync(gpgHome,{recursive:true,force:true});
            mkdirSync(output,{mode:0o700});
            renameSync(encrypted,join(output,'production-current-v4.dump.gpg'));
            writeFileSync(join(output,'summary.json'),JSON.stringify(report,null,2)+'\n',{mode:0o600,flag:'wx'});
            console.log('[production:current-v4-backup] PASS encrypted archive and byte verification; runtime unchanged.');
          } catch {
            rmSync(output,{recursive:true,force:true});
            console.error(`[production:current-v4-backup] FAIL during ${stage}; private material will be removed.`);
            process.exitCode=1;
          }
          NODE
      - name: Retain only verified ciphertext and the non-sensitive summary
        uses: actions/upload-artifact@v6
        with:
          name: production-current-v4-database-${{ github.run_id }}
          path: ${{ runner.temp }}/current-v4-db-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 90
          if-no-files-found: error

  inspect-v4-host-stability:
    name: inspect V4 host stability without changing services
    if: inputs.confirmation == 'INSPECT_V4_HOST_STABILITY'
    runs-on: [self-hosted, linux, x64, nxttrack]
    timeout-minutes: 5
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        target: [staging, production]
    concurrency:
      group: nxttrack-${{ matrix.target }}
      cancel-in-progress: false
    environment: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24.18.0"
      - name: Check exact active release and record application and Caddy service state
        env:
          TARGET: ${{ matrix.target }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          HOST_STABILITY_OUTPUT: ${{ runner.temp }}/v4-host-stability-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}.json
        run: node scripts/release/inspect-v4-host-stability.mjs
      - name: Retain non-sensitive host stability snapshot
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: v4-host-stability-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/v4-host-stability-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}.json
          if-no-files-found: error
          retention-days: 90

  inspect-parent-rls-timeout:
    name: inspect parent score RLS plans without writes
    if: inputs.confirmation == 'INSPECT_PARENT_RLS_TIMEOUT'
    runs-on: [self-hosted, linux, x64, nxttrack]
    timeout-minutes: 5
    concurrency:
      group: nxttrack-staging
      cancel-in-progress: false
    environment: staging
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24.18.0"
      - name: Install locked diagnostic dependency
        run: |
          corepack enable
          corepack prepare pnpm@10.24.0 --activate
          pnpm install --frozen-lockfile
      - name: Diagnose the existing staging parent session with RLS enforced
        env:
          TARGET: staging
          RELEASE_SHA: ${{ inputs.release_sha }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PARENT_RLS_DIAGNOSTIC_OUTPUT: ${{ runner.temp }}/parent-rls-diagnostic-${{ github.run_id }}.json
        run: node scripts/release/inspect-parent-rls-timeout.mjs
      - name: Retain bounded redacted diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: parent-rls-diagnostic-${{ github.run_id }}
          path: ${{ runner.temp }}/parent-rls-diagnostic-${{ github.run_id }}.json
          if-no-files-found: error
          retention-days: 14

  verify-staging-rls-fixtures:
    name: verify proposed staging fixtures and instructor flow without deployment
    if: inputs.confirmation == 'VERIFY_STAGING_RLS_FIXTURES'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: nxttrack-staging
      cancel-in-progress: false
    environment: staging
    env:
      RELEASE_SHA: ${{ inputs.release_sha }}
      STAGED_SHA: ${{ inputs.staging_release_sha }}
      APP_ENV: staging
      TARGET: staging
      APP_URL: https://staging.nxttrack.nl
      NEXT_PUBLIC_APP_URL: https://staging.nxttrack.nl
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      AUTH_CODE_PEPPER: ${{ secrets.AUTH_CODE_PEPPER }}
      SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      PHASE16_TENANT_SLUG: ${{ vars.PHASE16_TENANT_SLUG }}
      PHASE16_TENANT_HOSTNAME: ${{ vars.PHASE16_TENANT_HOSTNAME }}
      PHASE16_TENANT_NAME: ${{ vars.PHASE16_TENANT_NAME }}
      PHASE16_RESET_E2E_PASSWORDS: "false"
      PHASE16_PRESERVE_ADMIN_IDENTITIES: "true"
      PHASE16_SKIP_PLAYWRIGHT: "true"
      RLS_ROLE_SMOKE_REQUIRED: "true"
      RLS_PLATFORM_OWNER_EMAIL: admin@nxttrack.nl
      E2E_PLATFORM_OWNER_EMAIL: ${{ secrets.E2E_PLATFORM_OWNER_EMAIL || vars.E2E_PLATFORM_OWNER_EMAIL }}
      E2E_PLATFORM_OWNER_PASSWORD: ${{ secrets.E2E_PLATFORM_OWNER_PASSWORD }}
      E2E_TENANT_ADMIN_EMAIL: ${{ secrets.E2E_TENANT_ADMIN_EMAIL || vars.E2E_TENANT_ADMIN_EMAIL }}
      E2E_TENANT_ADMIN_PASSWORD: ${{ secrets.E2E_TENANT_ADMIN_PASSWORD }}
      E2E_INSTRUCTOR_EMAIL: ${{ secrets.E2E_INSTRUCTOR_EMAIL || vars.E2E_INSTRUCTOR_EMAIL }}
      E2E_INSTRUCTOR_PASSWORD: ${{ secrets.E2E_INSTRUCTOR_PASSWORD }}
      E2E_PARENT_EMAIL: ${{ secrets.E2E_PARENT_EMAIL || vars.E2E_PARENT_EMAIL }}
      E2E_PARENT_PASSWORD: ${{ secrets.E2E_PARENT_PASSWORD }}
    steps:
      - name: Checkout exact proposed validation source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0
      - name: Require unchanged application and schema
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$STAGED_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          git fetch --no-tags origin main
          git merge-base --is-ancestor FETCH_HEAD HEAD
          git diff --exit-code "$STAGED_SHA" "$RELEASE_SHA" -- apps packages supabase/migrations package.json pnpm-lock.yaml ':!apps/web/tests'
          echo "PHASE16_STATE_PATH=$RUNNER_TEMP/rls-fixture-$GITHUB_RUN_ID-phase16.json" >> "$GITHUB_ENV"
          echo "SPRINT4_ISOLATION_STATE_PATH=$RUNNER_TEMP/rls-fixture-$GITHUB_RUN_ID-isolation.json" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v6
        with:
          node-version: "24.18.0"
      - name: Verify active staging identity before preparing fictional fixtures
        env:
          EXPECTED_RELEASE_SHA: ${{ inputs.staging_release_sha }}
          EXPECTED_APP_ENV: staging
        run: node scripts/staging/health-smoke.mjs
      - name: Install certified fixture tooling
        run: |
          corepack enable
          corepack prepare pnpm@10.24.0 --activate
          pnpm install --frozen-lockfile
      - name: Prepare the existing operational staging fixture
        run: pnpm run phase16:flow
      - name: Prepare explicit staging isolation records
        run: node scripts/staging/prepare-sprint4-isolation.mjs
      - name: Verify all four roles using their own authenticated tokens
        run: pnpm run db:rls-role-smoke
      - name: Install Chromium for the focused live instructor check
        run: pnpm --filter @nxttrack/web exec playwright install --with-deps chromium
      - name: Verify instructor mutations with the proposed exact participant selection
        env:
          PLAYWRIGHT_BASE_URL: https://staging.nxttrack.nl
          SPRINT4_INSTRUCTOR_MUTATIONS_ENABLED: "true"
        run: pnpm --filter @nxttrack/web exec playwright test tests/e2e/sprint4-instructor-mutations.spec.ts --project=chromium-desktop --retries=0 --trace=off
      - name: Retain focused instructor failure screenshots without private fixture state
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: staging-instructor-precheck-${{ github.run_id }}
          path: apps/web/test-results/**/test-failed-*.png
          if-no-files-found: ignore
          retention-days: 14
      - name: Confirm the application release remains healthy and unchanged
        if: always()
        env:
          EXPECTED_RELEASE_SHA: ${{ inputs.staging_release_sha }}
          EXPECTED_APP_ENV: staging
        run: node scripts/staging/health-smoke.mjs
      - name: Remove private fixture state
        if: always()
        run: |
          rm -f -- "$RUNNER_TEMP/rls-fixture-$GITHUB_RUN_ID-phase16.json" "$RUNNER_TEMP/rls-fixture-$GITHUB_RUN_ID-isolation.json"

  restore-staging-release-evidence:
    name: restore and pin historical staging rollback without activation
    if: inputs.confirmation == 'RESTORE_STAGING_RELEASE_EVIDENCE'
    runs-on: [self-hosted, linux, x64, nxttrack]
    timeout-minutes: 10
    concurrency:
      group: nxttrack-staging
      cancel-in-progress: false
    environment: staging
    env:
      RELEASE_SHA: ${{ inputs.release_sha }}
      STAGED_SHA: ${{ inputs.staging_release_sha }}
      HISTORICAL_SHA: 6b3c9abb686be198830f417e663ac94124d7066f
    steps:
      - name: Confirm the exact new staging candidate
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$RELEASE_SHA" = "$STAGED_SHA"
          {
            echo "EVIDENCE_OUTPUT=$RUNNER_TEMP/staging-evidence-recovery-$GITHUB_RUN_ID"
            echo "EVIDENCE_STATE=$RUNNER_TEMP/staging-evidence-state-$GITHUB_RUN_ID.json"
            echo "PIN_HELPER=$RUNNER_TEMP/pin-staging-rollback-$GITHUB_RUN_ID.mjs"
          } >> "$GITHUB_ENV"
      - name: Checkout this exact operation implementation
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - name: Preserve the operation helper before checking out canonical tools
        run: cp scripts/release/pin-historical-staging-release.mjs "$PIN_HELPER"
      - name: Checkout the candidate's canonical evidence and rollback tools
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0
      - name: Setup certified Node
        uses: actions/setup-node@v6
        with:
          node-version: "24.18.0"
      - name: Bind source and record the current runtime without exposing configuration
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$RELEASE_SHA" FETCH_HEAD
          python3 --version
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          import {execFileSync} from 'node:child_process';
          import {appendFileSync,existsSync,mkdirSync,readFileSync,realpathSync,writeFileSync} from 'node:fs';
          import {join} from 'node:path';
          import {pathToFileURL} from 'node:url';
          import {fetchStagingEvidence} from './scripts/release/preserve-staging-release-evidence.mjs';
          const {inspectHistoricalRelease}=await import(pathToFileURL(process.env.PIN_HELPER));
          const base='/var/www/nxttrack/staging';
          const current=realpathSync(join(base,'current'));
          const identity=JSON.parse(readFileSync(join(current,'artifacts/exact-source-sha.json'),'utf8'));
          assert.equal(identity.commitSha,process.env.RELEASE_SHA,'The expected candidate is not active on staging.');
          const evidenceBytes=readFileSync(join(current,'artifacts/release-evidence.json'));
          const evidence=JSON.parse(evidenceBytes);
          assert.equal(evidence.target,'staging');
          assert.equal(evidence.source?.commitSha,process.env.RELEASE_SHA);
          assert.equal(evidence.gates?.phase15Staging,'passed');
          assert.equal(evidence.gates?.phase16Staging,'passed');
          const verified=await fetchStagingEvidence({repository:'nxttrack/platform',sourceSha:process.env.RELEASE_SHA,
            runId:evidence.workflow?.runId,token:process.env.GITHUB_TOKEN});
          assert.ok(verified.run.status==='completed' && verified.run.conclusion==='success'
            && verified.evidence.equals(evidenceBytes),'The active staging release needs completed full-gate original evidence.');
          const response=await fetch('https://staging.nxttrack.nl/api/health',{signal:AbortSignal.timeout(20000)});
          const health=await response.json();
          assert.ok(response.ok && health.ok && health.env==='staging' && health.commitSha===process.env.RELEASE_SHA
            && health.checks?.database?.status==='pass' && health.checks?.schemaCompatibility?.status==='pass');
          const hash=(file)=>createHash('sha256').update(readFileSync(file)).digest('hex');
          const historical=inspectHistoricalRelease({baseDirectory:base,releaseSha:process.env.RELEASE_SHA}).releaseDirectory;
          appendFileSync(process.env.GITHUB_ENV,`HISTORICAL_RELEASE=${historical}\n`);
          const oldIdentity=JSON.parse(readFileSync(join(historical,'artifacts/exact-source-sha.json'),'utf8'));
          assert.equal(oldIdentity.commitSha,process.env.HISTORICAL_SHA);
          const snapshot={current,environment:hash(join(base,'shared/.env')),currentIdentity:hash(join(current,'artifacts/exact-source-sha.json')),
            historicalIdentity:hash(join(historical,'artifacts/exact-source-sha.json')),
            pid:execFileSync('systemctl',['show','--property','MainPID','--value','nxttrack-staging'],{encoding:'utf8'}).trim()};
          writeFileSync(process.env.EVIDENCE_STATE,JSON.stringify(snapshot),{mode:0o600});
          mkdirSync(process.env.EVIDENCE_OUTPUT,{recursive:true,mode:0o700});
          const report={releaseSha:identity.commitSha,historicalSha:oldIdentity.commitSha,
            historicalEvidenceAlreadyPresent:existsSync(join(historical,'artifacts/release-evidence.json')),health:'pass'};
          writeFileSync(join(process.env.EVIDENCE_OUTPUT,'before.json'),JSON.stringify(report,null,2)+'\n');
          console.log(JSON.stringify(report));
          NODE
      - name: Preserve the original validated historical GitHub artifact
        env:
          GITHUB_TOKEN: ${{ github.token }}
          STAGING_EVIDENCE_SOURCE_SHA: 6b3c9abb686be198830f417e663ac94124d7066f
          STAGING_EVIDENCE_RUN_ID: "35474984786"
        run: |
          set -euo pipefail
          export STAGING_EVIDENCE_RELEASE_DIRECTORY="$HISTORICAL_RELEASE"
          node scripts/release/preserve-staging-release-evidence.mjs | tee "$EVIDENCE_OUTPUT/preserved.json"
      - name: Atomically pin the inactive historical release outside canonical pruning
        run: |
          set -euo pipefail
          node "$PIN_HELPER" pin | tee "$EVIDENCE_OUTPUT/pinned.json"
          node --input-type=module <<'NODE'
          import {appendFileSync,readFileSync} from 'node:fs';
          import {join} from 'node:path';
          const result=JSON.parse(readFileSync(join(process.env.EVIDENCE_OUTPUT,'pinned.json'),'utf8'));
          appendFileSync(process.env.GITHUB_ENV,`HISTORICAL_RELEASE=${result.releaseDirectory}\n`);
          NODE
      - name: Validate rollback to the proven historical release without switching runtime
        run: |
          set -euo pipefail
          scripts/release/rehearse-runtime-rollback.sh staging "$HISTORICAL_RELEASE" --check-only \
            | tee "$EVIDENCE_OUTPUT/rollback-check.txt"
      - name: Prove runtime, configuration and immutable identities were not changed
        if: always()
        run: |
          set -euo pipefail
          if [[ ! -f "$EVIDENCE_STATE" ]]; then
            echo "No runtime snapshot was created; preservation was not reached."
            exit 0
          fi
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          import {execFileSync} from 'node:child_process';
          import {readFileSync,realpathSync,writeFileSync} from 'node:fs';
          import {join} from 'node:path';
          import {pathToFileURL} from 'node:url';
          const {inspectHistoricalRelease}=await import(pathToFileURL(process.env.PIN_HELPER));
          const base='/var/www/nxttrack/staging';
          const before=JSON.parse(readFileSync(process.env.EVIDENCE_STATE,'utf8'));
          const current=realpathSync(join(base,'current'));
          const historical=inspectHistoricalRelease({baseDirectory:base,releaseSha:process.env.RELEASE_SHA}).releaseDirectory;
          const hash=(file)=>createHash('sha256').update(readFileSync(file)).digest('hex');
          const after={current,environment:hash(join(base,'shared/.env')),currentIdentity:hash(join(current,'artifacts/exact-source-sha.json')),
            historicalIdentity:hash(join(historical,'artifacts/exact-source-sha.json')),
            pid:execFileSync('systemctl',['show','--property','MainPID','--value','nxttrack-staging'],{encoding:'utf8'}).trim()};
          assert.deepEqual(after,before,'Runtime state changed during the evidence-only operation.');
          const report={releaseSha:process.env.RELEASE_SHA,historicalSha:process.env.HISTORICAL_SHA,
            runtimeUnchanged:true,configurationUnchanged:true,immutableIdentitiesUnchanged:true,serviceProcessUnchanged:true};
          writeFileSync(join(process.env.EVIDENCE_OUTPUT,'unchanged.json'),JSON.stringify(report,null,2)+'\n');
          console.log(JSON.stringify(report));
          NODE
      - name: Retain non-sensitive preservation and rollback-check evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: staging-pinned-historical-evidence-and-rollback-check-${{ github.run_id }}
          path: ${{ env.EVIDENCE_OUTPUT }}
          if-no-files-found: warn
          retention-days: 90

  check-production-rollback:
    name: check production rollback without changing runtime
    if: inputs.confirmation == 'CHECK_PRODUCTION_ROLLBACK'
    runs-on: [self-hosted, linux, x64, nxttrack]
    timeout-minutes: 10
    concurrency:
      group: nxttrack-production
      cancel-in-progress: false
    environment: production
    env:
      RELEASE_SHA: ${{ inputs.release_sha }}
      STAGED_SHA: ${{ inputs.staging_release_sha }}
      HISTORICAL_SHA: 6b3c9abb686be198830f417e663ac94124d7066f
      # Recorded by successful production deployment run 35477451482.
      HISTORICAL_RELEASE: /var/www/nxttrack/production/releases/20260919235652-6b3c9ab
      HISTORICAL_RUN_ID: "35477451482"
    steps:
      - name: Confirm the exact promoted production candidate
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$RELEASE_SHA" = "$STAGED_SHA"
          test "$RELEASE_SHA" != "$HISTORICAL_SHA"
          echo "EVIDENCE_OUTPUT=$RUNNER_TEMP/production-rollback-check-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
          echo "EVIDENCE_STATE=$RUNNER_TEMP/production-rollback-state-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json" >> "$GITHUB_ENV"
      - name: Checkout the promoted candidate's canonical rollback tools
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0
      - name: Setup certified Node
        uses: actions/setup-node@v6
        with:
          node-version: "24.18.0"
      - name: Bind canonical source, healthy production and historical release
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$RELEASE_SHA" FETCH_HEAD
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          import {execFileSync} from 'node:child_process';
          import {lstatSync,mkdirSync,readFileSync,readlinkSync,realpathSync,writeFileSync} from 'node:fs';
          import {join} from 'node:path';
          const base='/var/www/nxttrack/production';
          const current=realpathSync(join(base,'current'));
          const historical=process.env.HISTORICAL_RELEASE;
          const readJson=(file)=>JSON.parse(readFileSync(file,'utf8'));
          for (const [directory,sha] of [[current,process.env.RELEASE_SHA],[historical,process.env.HISTORICAL_SHA]]) {
            const identity=readJson(join(directory,'artifacts/exact-source-sha.json'));
            const evidence=readJson(join(directory,'artifacts/release-evidence.json'));
            assert.equal(identity.repository,process.env.GITHUB_REPOSITORY);
            assert.equal(identity.commitSha,sha,'Immutable identity differs from the expected production release.');
            assert.equal(evidence.application,'nxttrack-platform');
            assert.equal(evidence.target,'production');
            assert.equal(evidence.source?.commitSha,sha);
            assert.equal(evidence.workflow?.repository,process.env.GITHUB_REPOSITORY);
            assert.equal(String(evidence.workflow?.runId),String(identity.workflowRunId));
            if (directory===historical) assert.equal(String(identity.workflowRunId),process.env.HISTORICAL_RUN_ID);
          }
          const response=await fetch('https://nxttrack.nl/api/health',{signal:AbortSignal.timeout(20000)});
          const health=await response.json();
          assert.ok(response.ok && health.ok===true && health.app==='nxttrack-platform'
            && health.env==='production' && health.commitSha===process.env.RELEASE_SHA
            && health.checks?.database?.status==='pass' && health.checks?.schemaCompatibility?.status==='pass',
            'Production does not report a healthy exact promoted SHA.');
          const hash=(file)=>createHash('sha256').update(readFileSync(file)).digest('hex');
          const metadata=lstatSync(join(base,'shared/.env'));
          assert.ok(metadata.isFile() && !metadata.isSymbolicLink(),'Shared configuration must be a regular file.');
          const pid=execFileSync('systemctl',['show','--property','MainPID','--value','nxttrack-production'],{encoding:'utf8'}).trim();
          assert.match(pid,/^[1-9][0-9]*$/,'Production must have a live service process.');
          const snapshot={current,link:readlinkSync(join(base,'current')),environment:hash(join(base,'shared/.env')),
            environmentMetadata:[metadata.mode,metadata.uid,metadata.gid],
            currentIdentity:hash(join(current,'artifacts/exact-source-sha.json')),
            historicalIdentity:hash(join(historical,'artifacts/exact-source-sha.json')),
            currentEvidence:hash(join(current,'artifacts/release-evidence.json')),
            historicalEvidence:hash(join(historical,'artifacts/release-evidence.json')),pid};
          mkdirSync(process.env.EVIDENCE_OUTPUT,{recursive:true,mode:0o700});
          writeFileSync(process.env.EVIDENCE_STATE,JSON.stringify(snapshot),{mode:0o600,flag:'wx'});
          const report={releaseSha:process.env.RELEASE_SHA,historicalSha:process.env.HISTORICAL_SHA,
            historicalRelease:historical,historicalDeploymentRunId:process.env.HISTORICAL_RUN_ID,
            target:'production',health:'pass',operation:'rollback-check-only'};
          writeFileSync(join(process.env.EVIDENCE_OUTPUT,'before.json'),JSON.stringify(report,null,2)+'\n');
          console.log(JSON.stringify(report));
          NODE
      - name: Check canonical production rollback without activation or recovery
        id: rollback-check
        run: |
          set -euo pipefail
          scripts/release/rehearse-runtime-rollback.sh production "$HISTORICAL_RELEASE" --check-only \
            2>&1 | tee "$EVIDENCE_OUTPUT/rollback-check.txt"
      - name: Prove production runtime and configuration remain unchanged
        if: always()
        env:
          ROLLBACK_CHECK_OUTCOME: ${{ steps.rollback-check.outcome }}
        run: |
          set -euo pipefail
          if [[ -z "${EVIDENCE_STATE:-}" || ! -f "$EVIDENCE_STATE" ]]; then
            echo "No runtime snapshot was created; the rollback check was not reached."
            exit 0
          fi
          node --input-type=module <<'NODE'
          import {createHash} from 'node:crypto';
          import {execFileSync} from 'node:child_process';
          import {lstatSync,readFileSync,readlinkSync,realpathSync,writeFileSync} from 'node:fs';
          import {join} from 'node:path';
          const base='/var/www/nxttrack/production';
          const before=JSON.parse(readFileSync(process.env.EVIDENCE_STATE,'utf8'));
          const current=realpathSync(join(base,'current'));
          const historical=process.env.HISTORICAL_RELEASE;
          const hash=(file)=>createHash('sha256').update(readFileSync(file)).digest('hex');
          const metadata=lstatSync(join(base,'shared/.env'));
          const pid=execFileSync('systemctl',['show','--property','MainPID','--value','nxttrack-production'],{encoding:'utf8'}).trim();
          const checks={
            runtimeUnchanged:current===before.current && readlinkSync(join(base,'current'))===before.link,
            configurationUnchanged:metadata.isFile() && !metadata.isSymbolicLink()
              && hash(join(base,'shared/.env'))===before.environment
              && JSON.stringify([metadata.mode,metadata.uid,metadata.gid])===JSON.stringify(before.environmentMetadata),
            immutableIdentitiesUnchanged:hash(join(current,'artifacts/exact-source-sha.json'))===before.currentIdentity
              && hash(join(historical,'artifacts/exact-source-sha.json'))===before.historicalIdentity,
            releaseEvidenceUnchanged:hash(join(current,'artifacts/release-evidence.json'))===before.currentEvidence
              && hash(join(historical,'artifacts/release-evidence.json'))===before.historicalEvidence,
            serviceProcessUnchanged:pid===before.pid
          };
          const response=await fetch('https://nxttrack.nl/api/health',{signal:AbortSignal.timeout(20000)});
          const health=await response.json();
          checks.healthyPromotedRelease=response.ok && health.ok===true && health.app==='nxttrack-platform'
            && health.env==='production' && health.commitSha===process.env.RELEASE_SHA
            && health.checks?.database?.status==='pass' && health.checks?.schemaCompatibility?.status==='pass';
          const report={releaseSha:process.env.RELEASE_SHA,historicalSha:process.env.HISTORICAL_SHA,
            target:'production',rollbackCheckPassed:process.env.ROLLBACK_CHECK_OUTCOME==='success',...checks};
          writeFileSync(join(process.env.EVIDENCE_OUTPUT,'unchanged.json'),JSON.stringify(report,null,2)+'\n');
          console.log(JSON.stringify(report));
          if (!Object.values(checks).every(value=>value===true)) throw new Error('Production state or health changed during the check-only operation.');
          NODE
      - name: Retain non-sensitive production rollback-check evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: production-rollback-check-${{ github.run_id }}
          path: ${{ env.EVIDENCE_OUTPUT }}
          if-no-files-found: warn
          retention-days: 90

  rotate-backup-key:
    name: preserve historical keys and verify a strong encrypted backup
    if: inputs.confirmation == 'ROTATE_V4_BACKUP_KEYS'
    runs-on: [self-hosted, linux, x64, nxttrack]
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        target: [staging, production]
    concurrency:
      group: nxttrack-${{ matrix.target }}
      cancel-in-progress: false
    environment: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24.18.0"
      - name: Install locked backup dependencies
        run: |
          corepack enable
          corepack prepare pnpm@10.24.0 --activate
          pnpm install --frozen-lockfile
      - name: Preserve old recovery keys and rotate the active backup key
        id: rotate
        env:
          TARGET: ${{ matrix.target }}
          STORAGE_BACKUP_PASSPHRASE: ${{ secrets.STORAGE_BACKUP_PASSPHRASE }}
        run: node scripts/operations/rotate-storage-backup-key.mjs "$TARGET"
      - name: Retain encrypted historical recovery keys outside the VPS
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.target }}-historical-backup-key-recovery-${{ github.run_id }}
          path: ${{ steps.rotate.outputs.recovery_bundle_path }}
          if-no-files-found: error
          retention-days: 90
      - name: Create and decrypt-verify a complete backup with the new key
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          flock --exclusive --timeout 120 "/var/www/nxttrack/$TARGET/shared/v4-storage-backup.lock" \
            node scripts/operations/backup-storage-daily.mjs "$TARGET"
      - name: Check current operation and recovery evidence
        env:
          TARGET: ${{ matrix.target }}
          OPERATIONS_AUDIT_OUTPUT: ${{ runner.temp }}/runtime-operations-${{ matrix.target }}.json
        run: node scripts/operations/check-runtime-operations.mjs "$TARGET"
      - name: Retain non-sensitive operation evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: runtime-readiness-${{ matrix.target }}-${{ github.run_id }}
          path: ${{ runner.temp }}/runtime-operations-${{ matrix.target }}.json
          if-no-files-found: warn
          retention-days: 30

  verify-development-browser:
    name: repeat development filter browser regression
    if: inputs.confirmation == 'VERIFY_V4_BROWSER_TEST'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24.18.0"
      - name: Install and build the exact source
        run: |
          corepack enable
          corepack prepare pnpm@10.24.0 --activate
          pnpm install --frozen-lockfile
          pnpm build
      - name: Install WebKit and runtime libraries
        run: pnpm --filter @nxttrack/web exec playwright install --with-deps webkit
      - name: Repeat the filter, reload, dialog and history checks five times
        run: pnpm --filter @nxttrack/web exec playwright test tests/e2e/journey-development.spec.ts --config=playwright.journey.config.ts --project=journey-webkit --grep 'development searches' --repeat-each=5 --workers=1

  schedule-storage:
    name: install and verify daily encrypted V4 storage backups
    if: inputs.confirmation == 'SCHEDULE_V4_STORAGE_BACKUPS'
    runs-on: [self-hosted, linux, x64, nxttrack]
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        target: [staging, production]
    environment: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: "24.18.0"
      - name: Install durable tooling and environment-scoped encryption
        env:
          TARGET: ${{ matrix.target }}
          STORAGE_BACKUP_PASSPHRASE: ${{ secrets.STORAGE_BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          systemctl is-active cron
          command -v gpg tar flock crontab
          umask 077
          V4_OPERATIONS_DIR="/var/www/nxttrack/$TARGET/shared/operations-v4"
          mkdir -p "$V4_OPERATIONS_DIR/scripts/storage" "$V4_OPERATIONS_DIR/apps"
          cp scripts/storage/*.mjs "$V4_OPERATIONS_DIR/scripts/storage/"
          cp scripts/release/v4-storage-daily.mjs "$V4_OPERATIONS_DIR/v4-storage-daily.mjs"
          ln -sfn "/var/www/nxttrack/$TARGET/current/apps/web" "$V4_OPERATIONS_DIR/apps/web"
          test -n "$STORAGE_BACKUP_PASSPHRASE"
          printf '%s' "$STORAGE_BACKUP_PASSPHRASE" > "$V4_OPERATIONS_DIR/backup-passphrase"
          chmod 600 "$V4_OPERATIONS_DIR/backup-passphrase"
          node "$V4_OPERATIONS_DIR/v4-storage-daily.mjs" "$TARGET"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {spawnSync,execFileSync} from 'node:child_process';
          const target=process.env.TARGET;
          const base=`/var/www/nxttrack/${target}/shared`;
          const existing=spawnSync('crontab',['-l'],{encoding:'utf8'});
          assert.ok(existing.status===0 || existing.stderr.includes('no crontab'));
          const tag=`# nxttrack-v4-storage-${target}`;
          const lines=(existing.stdout || '').split('\n').filter(line=>line && !line.endsWith(tag));
          const minute=target==='production'?17:37;
          const entry=`${minute} 2 * * * /usr/bin/flock -n ${base}/v4-storage-backup.lock ${process.execPath} ${base}/operations-v4/v4-storage-daily.mjs ${target} >> ${base}/v4-storage-backup.log 2>&1 ${tag}`;
          assert.equal(spawnSync('crontab',['-'],{input:[...lines,entry,''].join('\n')}).status,0);
          assert.ok(execFileSync('crontab',['-l'],{encoding:'utf8'}).includes(entry));
          console.log(`[v4-storage] PASS daily encrypted backup scheduled for ${target}.`);
          NODE
          test -s "/var/www/nxttrack/$TARGET/shared/v4-recurring-jobs.log"
          tail -n 6 "/var/www/nxttrack/$TARGET/shared/v4-recurring-jobs.log"

  configure-v4:
    name: enable and schedule deployed V4 capabilities
    if: inputs.confirmation == 'CONFIGURE_V4_ENVIRONMENTS'
    runs-on: [self-hosted, linux, x64, nxttrack]
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        target: [staging, production]
    environment: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: "24.18.0"
      - run: |
          corepack enable
          corepack prepare pnpm@10.24.0 --activate
          pnpm install --frozen-lockfile
      - name: Configure deployed environment and preserve existing scheduler entries
        env:
          TARGET: ${{ matrix.target }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          command -v crontab flock
          node scripts/release/v4-configure.mjs
          sudo systemctl restart "nxttrack-$TARGET"
          for attempt in {1..20}; do
            if node scripts/release/v4-recurring-jobs.mjs "$TARGET"; then break; fi
            if [[ "$attempt" == 20 ]]; then exit 1; fi
            sleep 2
          done

  verify-v4:
    name: verify live V4 through authenticated browsers
    if: inputs.confirmation == 'VERIFY_V4_ENVIRONMENTS' || inputs.confirmation == 'VERIFY_V4_STAGING'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: ${{ inputs.confirmation == 'VERIFY_V4_STAGING' && fromJSON('["staging"]') || fromJSON('["staging","production"]') }}
    environment: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: "24.18.0"
      - run: |
          corepack enable
          corepack prepare pnpm@10.24.0 --activate
          pnpm install --frozen-lockfile
          pnpm --filter @nxttrack/web exec playwright install --with-deps chromium
      - name: Verify public routes and existing authorized roles without mail or password resets
        env:
          TARGET: ${{ matrix.target }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          VERIFIER_SOURCE_SHA: ${{ github.sha }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          E2E_TENANT_ADMIN_EMAIL: ${{ secrets.E2E_TENANT_ADMIN_EMAIL || vars.E2E_TENANT_ADMIN_EMAIL }}
          E2E_INSTRUCTOR_EMAIL: ${{ secrets.E2E_INSTRUCTOR_EMAIL || vars.E2E_INSTRUCTOR_EMAIL }}
          E2E_PARENT_EMAIL: ${{ secrets.E2E_PARENT_EMAIL || vars.E2E_PARENT_EMAIL }}
        run: node scripts/release/v4-browser-verify.mjs
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: v4-${{ matrix.target }}-browser-verification-${{ github.run_id }}
          path: artifacts/v4-browser
          retention-days: 90
          if-no-files-found: error

  backup-legacy:
    name: retain encrypted database before legacy V4 upgrade
    if: inputs.confirmation == 'UPGRADE_EMPTY_PRODUCTION_TO_V4'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Export database with PostgreSQL 17
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          STORAGE_BACKUP_PASSPHRASE: ${{ secrets.STORAGE_BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          umask 077
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          const url = new URL(process.env.DATABASE_URL);
          for (const [key,value] of Object.entries({PGHOST:url.hostname,PGPORT:url.port || '5432',PGUSER:decodeURIComponent(url.username),PGPASSWORD:decodeURIComponent(url.password),PGDATABASE:url.pathname.slice(1),PGSSLMODE:'require'})) {
            if (/[\r\n]/.test(value)) throw new Error('Invalid database parameter');
            appendFileSync(process.env.GITHUB_ENV, `${key}=${value}\n`);
            if (key === 'PGPASSWORD') console.log(`::add-mask::${value}`);
          }
          NODE
      - name: Export and encrypt snapshot
        env:
          STORAGE_BACKUP_PASSPHRASE: ${{ secrets.STORAGE_BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          umask 077
          docker run --rm -e PGHOST -e PGPORT -e PGUSER -e PGPASSWORD -e PGDATABASE -e PGSSLMODE postgres:17 \
            pg_dump --format=custom --no-owner --no-acl --schema=public --schema=app_private --schema=auth --schema=storage --schema=supabase_migrations --schema=extensions > "$RUNNER_TEMP/production-before-v4.dump"
          test -s "$RUNNER_TEMP/production-before-v4.dump"
          docker run --rm -i postgres:17 pg_restore --list < "$RUNNER_TEMP/production-before-v4.dump" > "$RUNNER_TEMP/production-before-v4.contents"
          test -s "$RUNNER_TEMP/production-before-v4.contents"
          test -n "$STORAGE_BACKUP_PASSPHRASE"
          printf '%s' "$STORAGE_BACKUP_PASSPHRASE" > "$RUNNER_TEMP/v4-backup-passphrase"
          gpg --batch --yes --pinentry-mode loopback --passphrase-file "$RUNNER_TEMP/v4-backup-passphrase" \
            --symmetric --cipher-algo AES256 --output "$RUNNER_TEMP/production-before-v4.dump.gpg" "$RUNNER_TEMP/production-before-v4.dump"
          gpg --batch --quiet --pinentry-mode loopback --passphrase-file "$RUNNER_TEMP/v4-backup-passphrase" \
            --decrypt "$RUNNER_TEMP/production-before-v4.dump.gpg" | cmp - "$RUNNER_TEMP/production-before-v4.dump"
          sha256sum "$RUNNER_TEMP/production-before-v4.dump.gpg"
      - uses: actions/upload-artifact@v6
        with:
          name: production-database-before-v4-${{ github.run_id }}
          path: ${{ runner.temp }}/production-before-v4.dump.gpg
          retention-days: 90
          if-no-files-found: error
      - name: Remove unencrypted temporary material
        if: always()
        run: rm -f "$RUNNER_TEMP/production-before-v4.dump" "$RUNNER_TEMP/production-before-v4.contents" "$RUNNER_TEMP/v4-backup-passphrase"

  upgrade-empty-legacy:
    name: upgrade empty legacy production using official migrations
    needs: backup-legacy
    runs-on: [self-hosted, linux, x64, nxttrack]
    environment: production
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      RELEASE_TARGET: production
      TARGET: production
      RELEASE_SHA: ${{ inputs.release_sha }}
      PRODUCTION_FOUNDATION_RUN_ID: ${{ inputs.production_foundation_run_id }}
      PRODUCTION_MIGRATION_REHEARSAL_RUN_ID: ${{ inputs.production_migration_rehearsal_run_id }}
      BASE_DIR: /var/www/nxttrack/production
      SERVICE_NAME: nxttrack-production
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0
      - name: Bind upgrade to current main and successful staging validation
        env:
          GITHUB_TOKEN: ${{ github.token }}
          STAGING_SHA: ${{ inputs.staging_release_sha }}
          APPROVAL_REFERENCE: ${{ inputs.production_approval_reference }}
        run: |
          set -euo pipefail
          test "$RELEASE_SHA" = "$STAGING_SHA"
          test "${#APPROVAL_REFERENCE}" -ge 8
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(git rev-parse FETCH_HEAD)" = "$RELEASE_SHA"
          node --input-type=module <<'NODE'
          const response = await fetch('https://api.github.com/repos/nxttrack/platform/actions/runs/35474984786', {headers:{authorization:`Bearer ${process.env.GITHUB_TOKEN}`}});
          const run = await response.json();
          if (!response.ok || run.conclusion !== 'success' || run.head_sha !== process.env.RELEASE_SHA || run.path !== '.github/workflows/deploy.yml' || run.head_branch !== 'main') throw new Error('Successful exact-source staging evidence required');
          const health = await (await fetch('https://staging.nxttrack.nl/api/health')).json();
          if (!health.ok || health.commitSha !== process.env.RELEASE_SHA) throw new Error('Live staging source mismatch');
          NODE
          GITHUB_SHA="$RELEASE_SHA" node scripts/release/verify-production-evidence.mjs
      - uses: actions/setup-node@v6
        with:
          node-version: "24.18.0"
      - name: Install certified migration tooling
        run: |
          corepack enable
          corepack prepare pnpm@10.24.0 --activate
          pnpm install --frozen-lockfile
          pnpm exec supabase db push --help > /dev/null
      - name: Verify empty business data before selecting legacy upgrade path
        run: |
          node --input-type=module <<'NODE'
          import pg from 'pg';
          const client = new pg.Client({connectionString:process.env.DATABASE_URL});
          await client.connect();
          try {
            await client.query('begin read only');
            for (const table of ['public.tenants','public.participants','public.enrollments','storage.objects']) {
              const {rows} = await client.query(`select count(*)::int n from ${table}`);
              if (rows[0].n !== 0) throw new Error(`Empty legacy upgrade requires no rows in ${table}`);
            }
            const {rows} = await client.query('select count(*)::int n from supabase_migrations.schema_migrations');
            if (rows[0].n !== 65) throw new Error('Expected audited 65-migration legacy baseline');
            await client.query('rollback');
            console.log('[v4-upgrade] PASS empty production baseline; existing platform owner is preserved.');
          } finally { await client.end(); }
          NODE
      - name: Atomically activate database-independent maintenance responder
        run: |
          set -euo pipefail
          MAINTENANCE_RELEASE="$BASE_DIR/releases/v4-maintenance-$GITHUB_RUN_ID"
          test ! -e "$MAINTENANCE_RELEASE"
          mkdir "$MAINTENANCE_RELEASE"
          readlink -f "$BASE_DIR/current" > "$BASE_DIR/shared/v4-$GITHUB_RUN_ID.previous-release"
          cp --dereference --preserve=mode "$BASE_DIR/shared/.env" "$BASE_DIR/shared/v4-$GITHUB_RUN_ID.previous.env"
          chgrp nxttrack-deploy "$BASE_DIR/shared/v4-$GITHUB_RUN_ID.previous.env"
          cat > "$MAINTENANCE_RELEASE/package.json" <<'JSON'
          {"private":true,"scripts":{"start":"node maintenance.cjs"}}
          JSON
          cat > "$MAINTENANCE_RELEASE/maintenance.cjs" <<'NODE'
          require('node:http').createServer((request,response) => {
            response.writeHead(503, {'Content-Type':'application/json','Cache-Control':'no-store','Retry-After':'120'});
            response.end(JSON.stringify({error:'maintenance_no_write',message:'NXTTRACK wordt bijgewerkt. Probeer het zo opnieuw.'}));
          }).listen(Number(process.env.PORT || 3800),'0.0.0.0');
          NODE
          chgrp -R nxttrack-deploy "$MAINTENANCE_RELEASE"
          chmod -R u+rwX,g+rX,o-rwx "$MAINTENANCE_RELEASE"
          ln -sfn "$MAINTENANCE_RELEASE" "$BASE_DIR/current.new"
          mv -Tf "$BASE_DIR/current.new" "$BASE_DIR/current"
          sudo systemctl restart "$SERVICE_NAME"
          for attempt in {1..20}; do
            code="$(curl --silent --output "$RUNNER_TEMP/v4-maintenance-response" --write-out '%{http_code}' --max-time 5 https://nxttrack.nl/api/health || true)"
            if [[ "$code" == '503' ]] && grep -q maintenance_no_write "$RUNNER_TEMP/v4-maintenance-response"; then break; fi
            if [[ "$attempt" == 20 ]]; then exit 1; fi
            sleep 2
          done
          echo '[v4-upgrade] PASS old application disconnected from all HTTP traffic.'
      - name: Apply the reviewed official migration chain
        env:
          APP_ENV: production
          RUN_DB_MIGRATIONS: "true"
          DB_MIGRATE_DRY_RUN: "false"
          DB_MIGRATE_INCLUDE_ALL: "false"
          DB_MIGRATION_REPAIR_EXISTING_SCHEMA: "false"
        run: pnpm run db:migrate
      - name: Verify upgraded data, complete schema and preserved owner
        env:
          DEPLOYED_SOURCE_SHA: ${{ inputs.release_sha }}
          UPGRADE_PREFLIGHT_DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          pnpm run db:preflight-production-readiness-upgrade
          pnpm run release:assert-schema-compatibility
          pnpm run db:inventory-production-read-only
          pnpm run db:advisors

  inspect-legacy:
    name: inspect V4 environment compatibility
    if: inputs.confirmation == 'INSPECT_V4_ENVIRONMENTS'
    runs-on: [self-hosted, linux, x64, nxttrack]
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        target: [staging, production]
    environment: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "24.18.0"
      - name: Install locked tooling
        run: |
          corepack enable
          corepack prepare pnpm@10.24.0 --activate
          pnpm install --frozen-lockfile
      - name: Inspect runtime capabilities without changing service state
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          sudo -n -l
          systemctl show "nxttrack-$TARGET" --property=User,Group,WorkingDirectory,ExecStart,FragmentPath,ActiveState
          readlink -f "/var/www/nxttrack/$TARGET/current"
          df -h /var/www/nxttrack
          command -v pg_dump pg_restore gpg clamdscan || true
          pg_dump --version || true
          stat /run/clamav/clamd.ctl || true
          ls -ld "/var/www/nxttrack/$TARGET/current/artifacts" || true
      - name: Check current workers and encrypted backup freshness read-only
        env:
          TARGET: ${{ matrix.target }}
          OPERATIONS_AUDIT_OUTPUT: ${{ runner.temp }}/runtime-operations-${{ matrix.target }}.json
        run: node scripts/operations/check-runtime-operations.mjs "$TARGET"
      - name: Retain current operation evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: runtime-readiness-${{ matrix.target }}-${{ github.run_id }}
          path: ${{ runner.temp }}/runtime-operations-${{ matrix.target }}.json
          retention-days: 30
          if-no-files-found: error
      - name: Inspect database and feature configuration read-only
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TARGET: ${{ matrix.target }}
        run: node scripts/release/v4-inspect.mjs

  recover:
    name: apply production migrations without application activation
    if: github.ref_name == 'main'
    runs-on: [self-hosted, linux, x64, nxttrack]
    environment: production

    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: 1
      NODE_OPTIONS: --max-old-space-size=3072
      TARGET: production
      RELEASE_TARGET: production
      RELEASE_CANONICAL_BRANCH: main
      RELEASE_SHA: ${{ inputs.release_sha }}
      STAGING_RELEASE_SHA: ${{ inputs.staging_release_sha }}
      PRODUCTION_APPROVAL_REFERENCE: ${{ inputs.production_approval_reference }}
      PRODUCTION_FOUNDATION_RUN_ID: ${{ inputs.production_foundation_run_id }}
      PRODUCTION_MIGRATION_REHEARSAL_RUN_ID: ${{ inputs.production_migration_rehearsal_run_id }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      APP_URL: ${{ vars.APP_URL }}
      SERVICE_NAME: ${{ vars.SERVICE_NAME || 'nxttrack-production' }}
      BASE_DIR: /var/www/nxttrack/production
      MAINTENANCE_NO_WRITE: ${{ vars.MAINTENANCE_NO_WRITE || 'false' }}
      EMAIL_SENDING_ENABLED: ${{ vars.EMAIL_SENDING_ENABLED || 'false' }}
      NEWSLETTER_DELIVERY_ENABLED: ${{ vars.NEWSLETTER_DELIVERY_ENABLED || 'false' }}
      INTERNAL_JOBS_ENABLED: ${{ vars.INTERNAL_JOBS_ENABLED || 'false' }}
      RUN_DB_MIGRATIONS: true
      DB_MIGRATION_REPAIR_EXISTING_SCHEMA: false
      DB_MIGRATE_DRY_RUN: false
      DB_MIGRATE_INCLUDE_ALL: false

    steps:
      - name: Confirm production recovery request
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          STAGING_RELEASE_SHA: ${{ inputs.staging_release_sha }}
          APPROVAL_REFERENCE: ${{ inputs.production_approval_reference }}
          FOUNDATION_RUN_ID: ${{ inputs.production_foundation_run_id }}
          REHEARSAL_RUN_ID: ${{ inputs.production_migration_rehearsal_run_id }}
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = "APPLY_PRODUCTION_MIGRATIONS"
          test "$RELEASE_SHA" = "$STAGING_RELEASE_SHA"
          [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "${#APPROVAL_REFERENCE}" -ge 8
          [[ "$FOUNDATION_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$REHEARSAL_RUN_ID" =~ ^[0-9]+$ ]]

      - name: Checkout exact canonical release source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0

      - name: Verify exact canonical main source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(git branch --show-current)" = ""
          # Keep the complete checkout history available to the compatibility
          # ancestry assertion. A depth-limited fetch would mark the release
          # tip shallow and make a real certified ancestor appear missing.
          git fetch --no-tags origin main
          test "$(git rev-parse --is-shallow-repository)" = "false"
          test "$(git rev-parse FETCH_HEAD)" = "$RELEASE_SHA"
          echo "[production-recovery] source SHA=$RELEASE_SHA"

      - name: Verify current production evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ inputs.release_sha }}
        run: node scripts/release/verify-production-evidence.mjs

      - name: Setup certified Node
        uses: actions/setup-node@v6
        with:
          node-version: "24.18.0"

      - name: Setup certified pnpm
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.24.0 --activate
          test "$(node --version)" = "v24.18.0"
          test "$(pnpm --version)" = "10.24.0"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Guard migration containment
        run: |
          set -euo pipefail
          test "$MAINTENANCE_NO_WRITE" = "true"
          test "$EMAIL_SENDING_ENABLED" = "false"
          test "$NEWSLETTER_DELIVERY_ENABLED" = "false"
          test "$INTERNAL_JOBS_ENABLED" = "false"
          test "$DB_MIGRATION_REPAIR_EXISTING_SCHEMA" = "false"
          test "$DB_MIGRATE_INCLUDE_ALL" = "false"

      - name: Restart old release into maintenance containment
        run: |
          set -euo pipefail
          sudo systemctl restart "$SERVICE_NAME"
          for attempt in {1..20}; do
            status="$(curl --silent --show-error --output /tmp/nxttrack-production-maintenance-response --write-out '%{http_code}' \
              --request POST --max-time 10 "$APP_URL/api/internal/email-outbox/process" || true)"
            if [[ "$status" == "503" ]] && grep -q 'maintenance_no_write' /tmp/nxttrack-production-maintenance-response; then
              echo "[production-recovery] maintenance containment PASS"
              break
            fi
            if [[ "$attempt" == "20" ]]; then
              echo "[production-recovery] maintenance containment was not proven" >&2
              exit 1
            fi
            sleep 3
          done

      - name: Run read-only production upgrade preflight
        env:
          UPGRADE_PREFLIGHT_DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm run db:preflight-production-readiness-upgrade

      - name: Apply official production migrations
        run: pnpm run db:migrate

      - name: Run post-migration read-only production preflight
        env:
          UPGRADE_PREFLIGHT_DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm run db:preflight-production-readiness-upgrade

      - name: Assert complete runtime schema before activation
        env:
          DEPLOYED_SOURCE_SHA: ${{ inputs.release_sha }}
        run: pnpm run release:assert-schema-compatibility

      - name: Record migration parity without writes
        run: pnpm run db:inventory-production-read-only

      - name: Explicitly confirm no application activation
        run: |
          echo "[production-recovery] PASS migrations only; no release activation, Caddy reload or application deployment was performed by this workflow."
