name: Automation recipe review runner

on:
  schedule:
    - cron: "35 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: automation-recipes-${{ github.ref }}
  cancel-in-progress: false

jobs:
  staging:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Check internal jobs release gate
        id: release_gate
        env:
          INTERNAL_JOBS_ENABLED: ${{ vars.INTERNAL_JOBS_ENABLED }}
        run: |
          if [ "$INTERNAL_JOBS_ENABLED" != "true" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Internal jobs are disabled for staging until its matching release is deployed."
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Create internal review tasks
        if: steps.release_gate.outputs.enabled == 'true'
        env:
          APP_URL: ${{ vars.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test "${#CRON_SECRET}" -ge 32
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $CRON_SECRET" \
            --header "Content-Type: application/json" \
            --data '{}' \
            "$APP_URL/api/internal/automation-recipes/tick"

  production:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check internal jobs release gate
        id: release_gate
        env:
          INTERNAL_JOBS_ENABLED: ${{ vars.INTERNAL_JOBS_ENABLED }}
        run: |
          if [ "$INTERNAL_JOBS_ENABLED" != "true" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Internal jobs are disabled for production until its matching release is deployed."
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Create internal review tasks
        if: steps.release_gate.outputs.enabled == 'true'
        env:
          APP_URL: ${{ vars.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test "${#CRON_SECRET}" -ge 32
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $CRON_SECRET" \
            --header "Content-Type: application/json" \
            --data '{}' \
            "$APP_URL/api/internal/automation-recipes/tick"
